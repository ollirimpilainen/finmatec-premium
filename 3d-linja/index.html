<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linja 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script type="module" src="https://unpkg.com/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script>
<style>
  :root{
    --ink:#0D0E2B; --ink2:#3A3C5C; --ultra:#2415BA; --acc:#03FF6B;
    --paper:#F5F6FB; --soft:#ECEEF7; --mute:#8D93B8; --line:#242749;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--ink); color:var(--paper);
    font:16px/1.55 Inter, system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; overflow:hidden;
  }
  header{
    padding:18px 26px 15px; border-bottom:1px solid var(--line);
    display:flex; align-items:baseline; gap:18px; flex-wrap:wrap;
    background:linear-gradient(180deg, #11132F 0%, var(--ink) 100%);
  }
  h1{
    font-size:16px; font-weight:600; margin:0; letter-spacing:-.012em;
    white-space:nowrap;
  }
  .sub{color:var(--mute); font-size:13px; font-variant-numeric:tabular-nums;}
  .picker{display:flex; gap:5px; margin-left:auto;}
  .picker button{
    font:inherit; font-size:13px; font-weight:500; color:var(--mute);
    background:transparent; border:1px solid var(--line);
    padding:6px 14px; border-radius:7px; cursor:pointer;
    transition:color .15s ease, background .15s ease, border-color .15s ease;
  }
  .picker button:hover{color:var(--paper); border-color:#34386A;}
  .picker button[aria-pressed="true"]{
    color:#fff; background:var(--ultra); border-color:var(--ultra);
  }
  .stage{position:relative; flex:1; min-height:0;}
  model-viewer{
    width:100%; height:100%;
    background:radial-gradient(130% 100% at 50% 8%, #1B1E47 0%, #0D0E2B 62%, #090A1E 100%);
    --progress-bar-height:0px;
  }
  .bar{
    position:absolute; left:0; top:0; height:2px; width:100%;
    background:var(--acc); transform-origin:left; transform:scaleX(0);
    transition:transform .2s ease, opacity .4s ease; z-index:3;
  }
  .hint{
    position:absolute; left:50%; bottom:24px; transform:translateX(-50%);
    color:var(--mute); font-size:13px;
    background:rgba(13,14,43,.74); border:1px solid var(--line);
    padding:7px 15px; border-radius:999px; backdrop-filter:blur(8px);
    transition:opacity .5s ease; pointer-events:none; white-space:nowrap;
  }
  .hint[hidden]{opacity:0; display:block;}
  .scale{
    position:absolute; left:26px; bottom:24px; color:var(--mute);
    font-size:12px; letter-spacing:.02em; pointer-events:none;
  }
  .scale b{color:var(--paper); font-weight:500;}
  @media (max-width:720px){
    header{padding:13px 16px; gap:10px;}
    h1{font-size:15px;}
    .sub{width:100%; order:3; font-size:12px;}
    .picker{margin-left:auto;}
    .scale{left:16px; bottom:18px;}
  }
</style>
</head>
<body>
<header>
  <h1>Pet food &middot; linja</h1>
  <span class="sub" id="stats"></span>
  <div class="picker" id="picker"></div>
</header>
<div class="stage">
  <div class="bar" id="bar"></div>
  <model-viewer id="mv"
    camera-controls auto-rotate rotation-per-second="11deg" auto-rotate-delay="1500"
    camera-orbit="38deg 72deg auto"
    shadow-intensity="1" shadow-softness="0.75" exposure="1.15"
    environment-image="neutral" tone-mapping="neutral"
    touch-action="pan-y" interaction-prompt="none">
  </model-viewer>
  <div class="scale" id="scale"></div>
  <div class="hint" id="hint"></div>
</div>
<script type="module">
const mv = document.getElementById('mv');
const bar = document.getElementById('bar');
const hint = document.getElementById('hint');
const stats = document.getElementById('stats');
const scale = document.getElementById('scale');
const picker = document.getElementById('picker');
const fi = n => n.toLocaleString('fi-FI');
hint.textContent = matchMedia('(pointer: coarse)').matches
  ? 'Vedä pyörittääksesi, nipistä zoomataksesi'
  : 'Vedä pyörittääksesi, rullaa zoomataksesi';

const presets = await fetch('report.json').then(r => r.json()).catch(() => []);
let active = null;

function load(p, btn) {
  if (active) active.setAttribute('aria-pressed', 'false');
  active = btn; btn.setAttribute('aria-pressed', 'true');
  bar.style.opacity = '1';
  bar.style.transform = 'scaleX(0)';
  mv.src = `linja-${p.preset}.glb?v=${p.bytes}`;
  stats.textContent = `${(p.bytes/1e6).toFixed(1).replace('.', ',')} MB · `
    + `${fi(p.piirtokolmiot)} kolmiota · ${fi(p.uniikkeja)} uniikkia osaa, `
    + `${fi(p.instansseja)} sijoitusta`;
}

// kosketuslaitteella kevein malli: vahemman dataa ja kolmioita.
// innerWidth voi olla 0 ennen kuin asettelu on valmis, joten sitae ei
// saa tulkita kapeaksi ruuduksi.
const leveys = innerWidth || document.documentElement.clientWidth || 1280;
const kevyt = matchMedia('(pointer: coarse)').matches || leveys < 720;
const haluttu = kevyt ? 'karkea' : 'keski';
const oletus = presets.findIndex(p => p.preset === haluttu);
presets.forEach((p, i) => {
  const b = document.createElement('button');
  b.textContent = p.preset;
  b.setAttribute('aria-pressed', 'false');
  b.onclick = () => load(p, b);
  picker.appendChild(b);
  if (i === (oletus < 0 ? 0 : oletus)) load(p, b);
});

mv.addEventListener('progress', e => {
  const t = e.detail.totalProgress;
  bar.style.transform = `scaleX(${t})`;
  if (t === 1) setTimeout(() => bar.style.opacity = '0', 300);
});
mv.addEventListener('load', () => {
  const d = mv.getDimensions();
  const f = v => v.toFixed(1).replace('.', ',');
  scale.innerHTML = `<b>${f(d.x)} × ${f(d.z)} m</b> pohja, <b>${f(d.y)} m</b> korkea`;
});
['pointerdown','wheel','touchstart'].forEach(ev =>
  mv.addEventListener(ev, () => hint.hidden = true, {once:true, passive:true}));
setTimeout(() => hint.hidden = true, 8000);
</script>
</body>
</html>
