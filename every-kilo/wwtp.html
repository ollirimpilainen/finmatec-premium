<style media="(min-width:761px)">
/* ===== Finmatec homepage stylesheet: the base for every page (shared by all 4 homepage artboards, unified 16.11.2026) ===== */
/* Tokens: colour, type, radius, surface, rhythm. Mobile overrides at the bottom. */
.fm { --ink:#0D0E2B; --ink2:#3A3C5C; --mute:#5F617E; --line:#D9DBE8; --soft:#ECEEF7; --paper:#F5F6FB; --dark:#2415BA; --acc:#03FF6B; --deep:#0D0E2B;
  --fd:'Exo 2',sans-serif; --fb:'Exo 2',sans-serif; --fl:'Exo 2',sans-serif; --ease:cubic-bezier(.32,.72,0,1);
  --disp:84px; --h1:64px; --h2:56px; --h2s:44px; --h3:30px; --h4:24px; --lead:18px; --body:16px; --small:14px; --cap:12px;
  --r-card:28px; --r-card-in:22px; --r-panel:36px; --r-panel-in:28px; --r-row:22px;
  --tray:rgba(36,21,186,.06); --tray-ring:inset 0 0 0 1px rgba(36,21,186,.10); --halo:0 0 0 6px rgba(36,21,186,.06), 0 0 0 7px rgba(36,21,186,.08);
  --sec:80px; --gut:72px;
  width:1440px; background:#fff; color:var(--ink); font-family:var(--fb); font-size:17px; line-height:1.55; -webkit-font-smoothing:antialiased; overflow:hidden; }
/* Base */
.fm * { box-sizing:border-box; }
.fm p { margin:0; }
.fm h1, .fm h2, .fm h3 { margin:0; font-family:var(--fd); font-weight:700; letter-spacing:-0.005em; line-height:1; }
.fm h2 { font-size:var(--h2); line-height:1.02; color:var(--dark); }
.fm h2.s { font-size:var(--h2s); line-height:1.04; }
.fm .hl { color:var(--ink); }
.fm .lead { font-size:var(--lead); color:var(--ink2); }
.fm a { color:inherit; text-decoration:none; }
.fm img, .fm video { display:block; width:100%; height:100%; object-fit:cover; }
.fm a:focus-visible, .fm button:focus-visible { outline:2px solid var(--dark); outline-offset:3px; }
.fm svg.ic { display:block; flex:none; }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
/* Caps label: eyebrow, field label, card label, table key, quote source. One style. */
.mono, .eyebrow, .fm .lab, .rw small, .fm .level div small, .st .n, .st.star .badge, .c-quote cite, .fm .sheet td:first-child { font-family:var(--fl); font-size:var(--cap); font-weight:700; letter-spacing:.12em; text-transform:uppercase; }
.eyebrow { display:inline-flex; align-items:center; gap:10px; color:var(--ink2); }
.eyebrow::before { content:""; width:18px; height:1px; background:var(--dark); }
.pf .eyebrow, .svc .eyebrow { color:var(--acc); }
.pf .eyebrow::before, .svc .eyebrow::before { background:var(--acc); }
/* Button: pill + nested arrow ball. Sizes: default 56, .s 48. Styles: .pri, .sec, .ghost; .qk = steel knob, Request a quote only. */
.btn { display:inline-flex; align-items:center; gap:14px; height:56px; padding:0 8px 0 26px; border-radius:999px; font-weight:600; font-size:16px; transition:transform .5s var(--ease); white-space:nowrap; }
.btn i { width:40px; height:40px; border-radius:50%; display:grid; place-items:center; flex:none; font-style:normal; }
.btn i svg { width:18px; height:18px; }
.btn.s { height:48px; padding:0 6px 0 20px; gap:12px; font-size:15px; }
.btn.s i { width:36px; height:36px; }
.btn.s i svg { width:16px; height:16px; }
.btn.pri { background:var(--dark); color:#fff; }
.btn.pri i { background:rgba(255,255,255,.16); color:#fff; }
.btn.sec { background:#fff; color:var(--ink); }
.btn.sec i { background:var(--dark); color:#fff; }
.btn.ghost { box-shadow:inset 0 0 0 1.5px currentColor; padding:0 22px 0 26px; gap:10px; }
.btn.ghost i { width:auto; height:auto; background:none; }
.btn.qk { box-shadow:0 10px 24px rgba(36,21,186,.28); }
.btn.qk i { color:#0b0a26; filter:drop-shadow(0 1px 0 rgba(255,255,255,.9)); background:repeating-radial-gradient(circle at 50% 50%,rgba(255,255,255,0) 0 1px,rgba(27,29,43,.05) 1px 2px),conic-gradient(from 25deg,#f6f8fa,#a9b0bc 11%,#eef1f5 24%,#99a1ae 37%,#f3f5f8 50%,#adb4c0 63%,#ebeef2 75%,#a1a9b6 88%,#f6f8fa); box-shadow:inset 0 0 0 1px rgba(255,255,255,.7),0 0 0 1px rgba(11,10,38,.18),0 2px 5px rgba(11,10,38,.3); }
/* Link row: a whole row is the link, arrow ball on the right. On dark and blue surfaces. */
.fm .lrow { display:flex; justify-content:space-between; align-items:center; gap:20px; height:88px; padding:0 22px 0 28px; border-radius:var(--r-row); background:rgba(255,255,255,.08); box-shadow:inset 0 0 0 1px rgba(255,255,255,.16); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); color:#fff; transition:background .4s var(--ease); }
.fm .lrow:hover { background:rgba(255,255,255,.14); }
.fm .lrow b { display:block; font-family:var(--fd); font-size:22px; font-weight:700; letter-spacing:-0.005em; line-height:1.2; }
.fm .lrow small { display:block; margin-top:3px; font-size:var(--small); opacity:.75; }
.fm .lrow i { width:44px; height:44px; border-radius:50%; display:grid; place-items:center; flex:none; background:var(--acc); color:var(--deep); }
.fm .lrow i svg { width:20px; height:20px; }
/* Chip: small pill link or option. .opt = selectable option in a form. */
.fm .chip { display:inline-flex; align-items:center; gap:8px; height:40px; padding:0 16px; border-radius:999px; background:var(--soft); color:var(--dark); font-size:var(--small); font-weight:600; white-space:nowrap; }
.fm .chip svg { width:14px; height:14px; }
.st.star .chip { background:rgba(255,255,255,.14); color:#fff; }
.fm .chip.opt { font:inherit; font-size:var(--small); font-weight:600; border:0; background:transparent; color:var(--ink); cursor:pointer; box-shadow:inset 0 0 0 1.5px var(--line); }
.fm .chip.opt.on { background:var(--dark); color:#fff; box-shadow:none; }
/* Text link */
.fm .tlink { display:inline-flex; gap:8px; align-items:center; font-size:17px; font-weight:600; border-bottom:1.5px solid currentColor; padding-bottom:3px; color:var(--dark); white-space:nowrap; }
.fm .tlink svg { width:16px; height:16px; }
/* Surfaces. Card: tray 28 / core 22 (6 px gap). Panel: tray 36 / core 28 (8 px gap, concentric with a 56 px pill). Halo: single surface with a soft ring. */
.st, .cell { border-radius:var(--r-card); padding:6px; background:var(--tray); box-shadow:var(--tray-ring); }
.st .core, .cell > .core { border-radius:var(--r-card-in); overflow:hidden; }
.sheet, .cb .form { border-radius:var(--r-panel); padding:8px; background:var(--tray); box-shadow:var(--tray-ring); display:flex; }
.sheet .in, .cb .form .in { flex:1; border-radius:var(--r-panel-in); background:#fff; }
.w2-ph, .w2-cert { border-radius:var(--r-card); box-shadow:var(--halo); }
.fpz-pan { border-radius:var(--r-panel); box-shadow:var(--halo); background:#fff; padding:8px; }
/* Fields: hairline */
.fm label.f, .fm label.ta { display:flex; padding:0 2px; border-bottom:1.5px solid var(--line); color:var(--mute); font-size:15px; }
.fm label.f { height:52px; align-items:center; }
.fm label.ta { height:auto; min-height:96px; padding-top:14px; align-items:flex-start; }
.fm label.f input, .fm label.ta textarea { all:unset; width:100%; font:inherit; font-size:15px; color:var(--ink); }
.fm label.ta textarea { height:100%; min-height:72px; }
.fm label.f input::placeholder, .fm label.ta textarea::placeholder { color:var(--mute); opacity:1; }
.fm label.f:focus-within, .fm label.ta:focus-within { border-bottom-color:var(--dark); }
/* Utility bar */
.util { height:38px; background:var(--deep); color:#cfcfcf; font-size:13px; display:flex; align-items:center; justify-content:space-between; padding:0 var(--gut); }
.util span { margin-right:28px; }
.util b { color:#fff; font-weight:600; }
.util .ext { display:inline-flex; align-items:center; gap:7px; color:#fff; }
.util .ext svg { width:12px; height:12px; opacity:.8; }
/* Hero and nav */
.hero { position:relative; height:860px; background:var(--deep); color:#fff; }
.hero .media { position:absolute; inset:0; }
.hero .media::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(10,10,10,.55) 0%, rgba(10,10,10,.05) 30%, rgba(10,10,10,.35) 58%, rgba(10,10,10,.92) 100%); }
.nav { position:absolute; top:22px; left:56px; right:56px; height:68px; display:flex; align-items:center; gap:40px; padding:0 10px 0 26px; border-radius:999px; background:linear-gradient(180deg,rgba(255,255,255,.78),rgba(255,255,255,.62)); color:var(--ink); box-shadow:inset 0 1px 0 rgba(255,255,255,.95), inset 0 0 0 1px rgba(255,255,255,.55), 0 14px 36px -14px rgba(0,0,0,.45); -webkit-backdrop-filter:blur(22px) saturate(170%); backdrop-filter:blur(22px) saturate(170%); z-index:2; }
.fm img.logoimg { width:auto; height:30px; object-fit:contain; }
.nav ul { list-style:none; display:flex; gap:30px; margin:0; padding:0; font-size:15px; font-weight:500; }
.nav ul li a { display:inline-flex; align-items:center; gap:6px; }
.nav ul li a svg { width:10px; height:10px; opacity:.6; }
.nav .btn { margin-left:auto; }
.fm .nav .mq { display:none; }
.hero-copy { position:absolute; left:var(--gut); right:var(--gut); bottom:168px; z-index:1; }
.hero h1 { font-size:var(--h1); line-height:.98; max-width:1180px; color:#fff; }
.router { position:absolute; left:56px; right:56px; bottom:40px; display:grid; grid-template-columns:repeat(3,1fr); gap:12px; z-index:1; }
/* Gains and numbers (open hairline grid) */
.rw { padding:var(--sec) var(--gut); background:#fff; }
.rw h2.stmt { max-width:1000px; color:var(--ink); }
.rw .stmt em { font-style:normal; color:var(--dark); background:linear-gradient(var(--acc),var(--acc)) 0 92%/100% 9px no-repeat; }
.rwk-grid { margin-top:64px; display:grid; grid-template-columns:repeat(3,1fr); }
.rwk-grid > .rw-i { padding:34px 40px; border-right:1px solid var(--line); }
.rwk-grid > .rw-i:nth-child(3n) { border-right:0; padding-right:0; }
.rwk-grid > .rw-i:nth-child(3n+1) { padding-left:0; }
.rwk-grid > .rw-i:nth-child(-n+3) { border-bottom:1px solid var(--line); padding-top:8px; }
.rwk-grid > .rw-i:nth-child(n+4) { padding-bottom:8px; }
.rw-i { display:flex; align-items:center; gap:20px; }
.rw-ar { width:72px; height:72px; border-radius:50%; display:grid; place-items:center; background:var(--dark); color:#fff; flex:none; }
.rw-i.dn .rw-ar { background:var(--acc); color:var(--deep); }
.rw-ar svg { width:32px; height:32px; }
.rw small { display:block; margin-bottom:8px; color:var(--ink2); }
.rw-t b { display:block; font-family:var(--fd); font-weight:700; font-size:34px; line-height:1; color:var(--dark); white-space:nowrap; }
.rw-num { font-family:var(--fd); font-weight:700; font-size:72px; line-height:.9; letter-spacing:-0.02em; color:var(--dark); flex:none; }
.rw-num i { font-style:normal; color:var(--acc); }
.rw-n .rw-t b { font-size:var(--h4); }
/* Logo band */
.logos { margin:64px calc(-1 * var(--gut)) 0; overflow:hidden; border-top:1px solid var(--line); border-bottom:1px solid var(--line); -webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent); mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent); }
.logos .ltrack { display:flex; width:max-content; will-change:transform; }
.logos .ltrack div { flex:none; width:200px; height:104px; display:grid; place-items:center; padding:20px 26px; border-left:1px solid var(--line); }
.fm .logos img { width:auto; height:auto; max-width:100%; max-height:52px; object-fit:contain; filter:grayscale(1) brightness(1.08) contrast(2.6); mix-blend-mode:multiply; }
.fm .logos img[alt="Fazer"], .fm .logos img[alt="Saarioinen"] { max-height:84px; transform:scale(1.35); }
/* Material flow */
.flow { padding:var(--sec) 0; background:var(--paper); }
.flow-head { display:grid; grid-template-columns:minmax(0,1fr) 360px; gap:48px; padding:0 var(--gut); align-items:center; }
.railwrap { margin-top:52px; overflow:hidden; }
.track { position:relative; display:flex; width:max-content; gap:20px; padding:0 var(--gut); animation:railpan 30s cubic-bezier(.65,0,.35,1) infinite alternate; }
@keyframes railpan { 0%, 14% { transform:translateX(0); } 86%, 100% { transform:translateX(calc(1440px - 100%)); } }
.track > .st { flex:none; width:520px; }
.st { position:relative; }
.st .core { height:100%; background:#fff; box-shadow:inset 0 1px 1px rgba(255,255,255,.8); }
.st .ph { position:relative; aspect-ratio:4/3; overflow:hidden; background:var(--deep); }
.st .ph img { width:100%; height:100%; object-fit:cover; transition:transform 1.2s var(--ease); }
.st:hover .ph img { transform:scale(1.04); }
.st .n { position:absolute; top:16px; left:16px; color:#fff; background:rgba(13,14,43,.55); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); padding:7px 11px; border-radius:999px; }
.st .body { padding:26px 28px 30px; display:grid; gap:12px; align-content:start; }
.st h3 { font-size:var(--h3); }
.st p { font-size:var(--body); color:var(--ink2); max-width:44ch; }
.st .prod { margin-top:6px; display:flex; flex-wrap:wrap; gap:8px; }
.st.star { background:rgba(36,21,186,.16); }
.st.star .core { background:var(--dark); color:#fff; box-shadow:none; }
.st.star h3 { color:#fff; }
.st.star p { color:rgba(255,255,255,.76); }
.st.star .badge { position:absolute; top:16px; right:16px; padding:7px 11px; border-radius:999px; background:var(--acc); color:var(--deep); }
.st.bin .ph { background:linear-gradient(180deg,#f7f9fc 0%,#e9eef5 100%); }
.st.bin .ph img { object-position:34% 42%; transform:scale(1.55); transform-origin:34% 42%; }
.st.bin:hover .ph img { transform:scale(1.62); }
.flow-foot { margin:40px var(--gut) 0; padding-top:28px; border-top:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; font-size:var(--lead); }
/* 40 kg */
.kg { display:grid; grid-template-columns:1.15fr 1fr; gap:56px; align-items:center; padding:var(--sec) var(--gut); }
.kg-num { font-family:var(--fd); font-weight:700; font-size:330px; line-height:.8; letter-spacing:-0.005em; color:var(--dark); }
.kg-num small { font-size:120px; letter-spacing:-0.02em; color:var(--acc); }
.kg h2 { margin-top:22px; }
.kg .lead { margin-top:22px; max-width:520px; }
/* Plate freezing */
.pf { background:var(--dark); color:#fff; padding:var(--sec) var(--gut); display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:72px; align-items:stretch; }
.pf h2 { margin-top:20px; color:#fff; }
.pf .lead { margin-top:24px; color:rgba(255,255,255,.75); }
.seg { margin-top:32px; display:grid; grid-template-columns:repeat(3,1fr); padding:5px; border-radius:999px; background:rgba(255,255,255,.07); box-shadow:inset 0 0 0 1px rgba(255,255,255,.12); }
.seg span { text-align:center; padding:14px 0; border-radius:999px; font-size:15px; font-weight:600; color:rgba(255,255,255,.65); }
.seg span.on { background:var(--acc); color:var(--deep); }
.level { position:relative; margin-top:34px; display:grid; grid-template-columns:repeat(4,1fr); gap:0; }
.level .belt { position:absolute; left:7px; right:0; top:5px; height:4px; border-radius:2px; background:rgba(255,255,255,.1); overflow:hidden; z-index:0; }
.level .belt::after { content:""; position:absolute; inset:0 -48px 0 0; animation:belt 1.2s linear infinite; background:repeating-linear-gradient(90deg, var(--acc) 0 14px, transparent 14px 24px); }
@keyframes belt { from { transform:translateX(-24px); } to { transform:translateX(0); } }
.level > div:not(.belt) { position:relative; z-index:1; padding-top:30px; }
.level > div:not(.belt)::before { content:""; position:absolute; left:0; top:0; width:14px; height:14px; border-radius:50%; background:var(--dark); box-shadow:inset 0 0 0 3px var(--acc); }
.level div b { display:block; font-size:17px; margin-top:4px; }
.fm .level div small { color:rgba(255,255,255,.9); }
.pf .cap { margin-top:22px; font-size:15px; color:rgba(255,255,255,.6); }
.pf .ctas { margin-top:36px; display:flex; gap:14px; align-items:center; }
.pf .btn.ghost { color:#fff; }
.bezel { padding:8px; border-radius:var(--r-panel); background:rgba(255,255,255,.06); box-shadow:inset 0 0 0 1px rgba(255,255,255,.12); display:flex; }
.bezel .in { flex:1; min-height:520px; border-radius:var(--r-panel-in); overflow:hidden; position:relative; background:var(--deep) url(media/v5302.jpg) center/cover; }
.bezel .in video { position:absolute; inset:0; opacity:0; animation:clips 18s infinite; }
.bezel .in video:nth-of-type(2) { animation-delay:6s; }
.bezel .in video:nth-of-type(3) { animation-delay:12s; }
@keyframes clips { 0% { opacity:0; } 4% { opacity:1; } 33% { opacity:1; } 38% { opacity:0; } 100% { opacity:0; } }
.bezel .tag { position:absolute; z-index:2; left:20px; bottom:20px; display:inline-flex; align-items:center; gap:8px; background:rgba(0,0,0,.5); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); color:#fff; border-radius:999px; padding:8px 14px; font-size:13px; }
.bezel .tag svg { width:10px; height:10px; }
/* Why choose Finmatec */
.wv { padding:var(--sec) var(--gut); background:#fff; }
.wv h3 { font-size:var(--h4); line-height:1.1; color:var(--dark); }
.wv p { margin:10px 0 0; font-size:var(--body); line-height:1.55; color:var(--ink2); }
.w2-wrap { margin-top:48px; display:grid; grid-template-columns:4fr 8fr; gap:28px 64px; }
.w2-ph { min-height:400px; }
.wv .wph { position:relative; overflow:hidden; color:#fff; }
.wv .wph img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.wv .wph::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(13,14,43,0) 40%,rgba(13,14,43,.82) 100%); }
.wv .wph .b { position:absolute; left:32px; right:32px; bottom:30px; z-index:1; }
.wv .wph h3 { color:#fff; font-size:var(--h3); }
.wv .wph p { color:rgba(255,255,255,.82); max-width:460px; }
.w2-grid { display:grid; grid-template-columns:1fr 1fr; }
.w2-c { padding:32px 36px; display:flex; flex-direction:column; justify-content:center; }
.w2-c:nth-child(odd) { padding-left:0; border-right:1px solid var(--line); }
.w2-c:nth-child(even) { padding-right:0; }
.w2-c:nth-child(-n+2) { border-bottom:1px solid var(--line); }
.w2-c h3 { white-space:nowrap; }
.w2-c p { max-width:340px; }
.w2-cert { margin-top:28px; padding:24px 36px; background:#fff; display:flex; justify-content:space-between; align-items:center; gap:32px; }
.wv .wc b { display:block; font-family:var(--fd); font-weight:700; font-size:20px; color:var(--dark); }
.wv .wc span { font-size:15px; color:var(--ink2); }
/* 80 %: existing factories, floor plan */
.exist { position:relative; background:#fff; padding:0; overflow:hidden; }
.exist .left { position:relative; z-index:1; width:680px; padding:var(--sec) var(--gut); display:flex; flex-direction:column; justify-content:space-between; gap:48px; }
.big80 { font-family:var(--fd); font-weight:700; font-size:240px; line-height:.8; letter-spacing:-0.005em; color:var(--dark); }
.big80 sup { font-size:110px; vertical-align:top; position:relative; top:22px; color:var(--acc); }
.exist h2 { margin-top:26px; max-width:560px; }
.exist .lead { margin-top:22px; max-width:560px; }
.ptitle { display:flex; justify-content:space-between; align-items:baseline; }
.ptitle b { font-size:22px; letter-spacing:-0.02em; }
.fpz-pan { margin-top:18px; }
.fpz-drop { border-radius:var(--r-panel-in); border:1.5px dashed rgba(36,21,186,.32); background:rgba(36,21,186,.03); padding:26px 20px 24px; display:flex; flex-direction:column; align-items:center; text-align:center; gap:6px; }
.fpz-ic { width:52px; height:52px; border-radius:50%; background:var(--dark); color:#fff; display:grid; place-items:center; margin-bottom:8px; }
.fpz-drop b { font-family:var(--fd); font-weight:700; font-size:20px; color:var(--ink); }
.fpz-drop span { font-size:var(--small); color:var(--ink2); }
.fpz-drop .fpz-ic { color:#fff; }
.fpz-drop u { color:var(--dark); font-weight:600; text-underline-offset:3px; }
.fpz-row { display:flex; align-items:center; gap:20px; padding:8px 0 0 20px; }
.fpz-row .f { flex:1; }
