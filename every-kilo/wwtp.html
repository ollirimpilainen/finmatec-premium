<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WWTP Solutions | Finmatec</title>
<meta name="description" content="Finmatec WWTP Solutions prototype, generated from the Claude Design canvas. Genero, 17.11.2026.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400..800&amp;display=swap">
<style media="(min-width:761px)">
.fm { --ink:#141414; --ink2:#3d3d3d; --mute:#6b6b6b; --line:#dcdcd8; --soft:#efefec; --paper:#f7f7f5; --dark:#111111; --dark2:#1c1c1c;
  --ease: cubic-bezier(.32,.72,0,1);
  width:1440px; background:#fff; color:var(--ink); font-family:var(--fb); font-size:17px; line-height:1.55; -webkit-font-smoothing:antialiased; overflow:hidden; }
.fm * { box-sizing:border-box; }
.fm p { margin:0; }
.fm h1,.fm h2,.fm h3 { margin:0; font-family:var(--fd); font-weight:700; letter-spacing:-0.025em; line-height:1; }
.fm a { color:inherit; text-decoration:none; }
.fm img, .fm video { display:block; width:100%; height:100%; object-fit:cover; }
.wrap { padding:0 72px; }
.mono { font-family:var(--fl); font-size:12px; letter-spacing:.12em; text-transform:uppercase; }
.eyebrow { display:inline-flex; align-items:center; gap:10px; font-family:var(--fl); font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--mute); }
.eyebrow::before { content:""; width:18px; height:1px; background:currentColor; }
/* Buttons: pill with nested arrow */
.btn { display:inline-flex; align-items:center; gap:14px; height:56px; padding:0 8px 0 26px; border-radius:999px; font-weight:600; font-size:16px; transition:transform .5s var(--ease); white-space:nowrap; }
.btn i { width:40px; height:40px; border-radius:50%; display:grid; place-items:center; font-style:normal; font-size:17px; }
.btn.dark { background:var(--ink); color:#fff; } .btn.dark i { background:rgba(255,255,255,.14); }
.btn.light { background:#fff; color:var(--ink); } .btn.light i { background:var(--soft); }
.btn.ghost { box-shadow:inset 0 0 0 1.5px currentColor; padding:0 26px; }
.tlink { display:inline-flex; gap:10px; align-items:center; font-weight:600; border-bottom:1.5px solid currentColor; padding-bottom:3px; }
/* Utility + header */
.util { height:38px; background:var(--dark); color:#cfcfcf; font-size:13px; display:flex; align-items:center; justify-content:space-between; padding:0 72px; }
.util span { margin-right:28px; } .util b { color:#fff; font-weight:600; }
.lang { display:inline-flex; gap:2px; border:1px solid rgba(255,255,255,.25); border-radius:999px; padding:2px; margin-left:20px; }
.lang em { font-style:normal; padding:2px 10px; border-radius:999px; font-size:12px; } .lang em:first-child { background:#fff; color:var(--ink); }
.hero { position:relative; height:860px; background:var(--dark); color:#fff; }
.hero .media { position:absolute; inset:0; }
.hero .media::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(10,10,10,.55) 0%, rgba(10,10,10,.05) 30%, rgba(10,10,10,.35) 58%, rgba(10,10,10,.92) 100%); }
.nav { position:absolute; top:22px; left:56px; right:56px; height:68px; display:flex; align-items:center; gap:40px; padding:0 10px 0 26px; border-radius:999px; background:linear-gradient(180deg,rgba(255,255,255,.78),rgba(255,255,255,.62)); color:var(--ink); box-shadow:inset 0 1px 0 rgba(255,255,255,.95), inset 0 0 0 1px rgba(255,255,255,.55), 0 14px 36px -14px rgba(0,0,0,.45); -webkit-backdrop-filter:blur(22px) saturate(170%); backdrop-filter:blur(22px) saturate(170%); z-index:2; }
.fm img.logoimg { width:auto; height:30px; object-fit:contain; }
.fm img.logoimg.dark { filter:brightness(0) saturate(0); opacity:.92; }
.foot img.logoimg { height:34px; }
.logo { font-family:var(--fd); font-weight:700; font-size:21px; letter-spacing:.04em; }
.nav ul { list-style:none; display:flex; gap:30px; margin:0; padding:0; font-size:15px; font-weight:500; }
.nav ul li span { opacity:.6; font-size:11px; margin-left:5px; }
.nav .btn { margin-left:auto; height:50px; } .nav .btn i { width:34px; height:34px; }
.hero-copy { position:absolute; left:72px; right:72px; bottom:168px; z-index:1; }
.hero h1 { font-size:84px; max-width:1296px; line-height:.96; }
.hero .lead { margin-top:28px; font-size:21px; line-height:1.45; max-width:620px; color:rgba(255,255,255,.82); }
.router { position:absolute; left:56px; right:56px; bottom:40px; display:grid; grid-template-columns:repeat(3,1fr); gap:12px; z-index:1; }
.router a { display:flex; justify-content:space-between; align-items:center; height:88px; padding:0 14px 0 24px; border-radius:22px; background:rgba(255,255,255,.08); box-shadow:inset 0 0 0 1px rgba(255,255,255,.16); backdrop-filter:blur(14px); }
.router b { display:block; font-family:var(--fd); font-size:22px; font-weight:700; letter-spacing:-0.02em; }
.router small { display:block; margin-top:3px; font-size:14px; opacity:.75; }
.router i { width:44px; height:44px; border-radius:50%; display:grid; place-items:center; font-style:normal; background:rgba(255,255,255,.14); }
.vidtag { position:absolute; top:112px; right:72px; z-index:1; display:flex; gap:10px; align-items:center; font-size:12px; color:rgba(255,255,255,.8); }
.vidtag::before { content:""; width:8px; height:8px; border-radius:50%; background:#fff; animation:pulse 2s infinite; }
@keyframes pulse { 50% { opacity:.25; } }
/* 40 kg */
.kg { display:grid; grid-template-columns:1.15fr 1fr; gap:56px; align-items:center; padding:80px 72px 72px; }
.kg-num { font-family:var(--fd); font-weight:700; font-size:330px; line-height:.8; letter-spacing:-0.05em; color:var(--ink); }
.kg-num small { font-size:120px; letter-spacing:-0.02em; }
.kg h2 { font-size:46px; line-height:1.02; }
.kg p { margin-top:22px; font-size:19px; color:var(--ink2); max-width:520px; }
.kg .tlink { margin-top:30px; }
/* Flow */
.flow { padding:84px 0 84px; background:var(--paper); }
.flow-head { display:grid; grid-template-columns:minmax(0,1fr) 360px; gap:48px; padding:0 72px; align-items:center; }
.flow h2 { font-size:56px; line-height:1.02; }
.pill { display:inline-block; width:118px; height:50px; border-radius:999px; overflow:hidden; vertical-align:-6px; margin:0 6px; }
.flow-head p { font-size:18px; color:var(--ink2); }
.railwrap { margin-top:52px; overflow:hidden; }
.track { position:relative; display:flex; gap:24px; width:max-content; padding:0 72px; animation:railpan 26s cubic-bezier(.65,0,.35,1) infinite alternate; }
.track > .st { flex:none; width:430px; }
.track > .st.star { width:520px; }
@keyframes railpan { 0%, 14% { transform:translateX(0); } 86%, 100% { transform:translateX(calc(1440px - 100%)); } }
.track::before { content:""; position:absolute; left:72px; right:72px; top:21px; height:1px; background:var(--line); }
.st { position:relative; }
.st .dot { width:42px; height:42px; border-radius:50%; background:#fff; box-shadow:inset 0 0 0 1px var(--line); display:grid; place-items:center; font-family:var(--fl); font-size:12px; margin-bottom:22px; }
.st .ph { height:260px; border-radius:22px; overflow:hidden; }
.st h3 { margin-top:22px; font-size:26px; }
.st .prod { margin-top:10px; font-weight:600; font-size:15px; display:flex; flex-wrap:wrap; gap:4px 14px; }
.st .prod a { border-bottom:1.5px solid currentColor; }
.st p { margin-top:10px; font-size:15px; color:var(--mute); }
.st.star .dot { background:var(--ink); color:#fff; box-shadow:none; }
.st.star .card { background:var(--dark); color:#fff; border-radius:26px; padding:8px 8px 26px; }
.st.star .ph { height:260px; border-radius:20px; }
.st.star h3, .st.star .prod, .st.star p { padding:0 18px; }
.st.star p { color:rgba(255,255,255,.7); }
.st.star .badge { display:inline-block; margin:18px 18px 0; font-family:var(--fl); font-size:11px; letter-spacing:.12em; text-transform:uppercase; border:1px solid rgba(255,255,255,.3); border-radius:999px; padding:4px 10px; }
.st.star h3 { margin-top:12px; }
.flow-foot { margin:44px 72px 0; padding-top:28px; border-top:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; font-size:18px; }
/* Plate freezing */
.pf { background:var(--dark); color:#fff; padding:88px 72px; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:72px; align-items:stretch; }
.pf .eyebrow { color:rgba(255,255,255,.6); }
.pf h2 { margin-top:20px; font-size:52px; line-height:1; }
.pf .body { margin-top:24px; font-size:18px; color:rgba(255,255,255,.75); max-width:none; }
.seg { margin-top:32px; display:grid; grid-template-columns:repeat(3,1fr); padding:5px; border-radius:999px; background:rgba(255,255,255,.07); box-shadow:inset 0 0 0 1px rgba(255,255,255,.12); }
.seg span { text-align:center; padding:14px 0; border-radius:999px; font-size:15px; font-weight:600; color:rgba(255,255,255,.65); }
.seg span.on { background:#fff; color:var(--ink); }
.level { position:relative; margin-top:34px; display:grid; grid-template-columns:repeat(4,1fr); gap:0; }
.level .belt { position:absolute; left:7px; right:0; top:5px; height:4px; border-radius:2px; background:rgba(255,255,255,.1); overflow:hidden; z-index:0; }
.level .belt::after { content:""; position:absolute; inset:0 -48px 0 0; background:repeating-linear-gradient(90deg, rgba(255,255,255,.9) 0 14px, transparent 14px 24px); animation:belt 1.2s linear infinite; }
@keyframes belt { from { transform:translateX(-24px); } to { transform:translateX(0); } }
.level > div:not(.belt) { position:relative; z-index:1; padding-top:30px; }
.level > div:not(.belt)::before { content:""; position:absolute; left:0; top:0; width:14px; height:14px; border-radius:50%; background:var(--dark); box-shadow:inset 0 0 0 3px #fff; }
.level div b { display:block; font-size:17px; margin-top:4px; } .level div small { font-family:var(--fl); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:rgba(255,255,255,.55); }
.level div.auto small { color:#fff; }
.pf .cap { margin-top:22px; font-size:15px; color:rgba(255,255,255,.6); }
.pf .ctas { margin-top:36px; display:flex; gap:14px; align-items:center; }
.pf .btn.ghost { color:#fff; }
.bezel { padding:10px; border-radius:34px; background:rgba(255,255,255,.06); box-shadow:inset 0 0 0 1px rgba(255,255,255,.12); display:flex; }
.bezel .in { flex:1; min-height:520px; border-radius:26px; overflow:hidden; position:relative; }
.bezel .in video { position:absolute; inset:0; opacity:0; animation:clips 18s infinite; }
.bezel .in video:nth-of-type(2) { animation-delay:6s; } .bezel .in video:nth-of-type(3) { animation-delay:12s; }
@keyframes clips { 0% { opacity:0; } 4% { opacity:1; } 33% { opacity:1; } 38% { opacity:0; } 100% { opacity:0; } }
.bezel .tag { position:absolute; left:20px; bottom:20px; background:rgba(0,0,0,.5); backdrop-filter:blur(8px); color:#fff; border-radius:999px; padding:8px 14px; font-size:13px; }
/* Why */
.why { padding:100px 72px 90px; display:grid; grid-template-columns:420px 1fr; gap:90px; }
.why h2 { font-size:60px; line-height:1; }
.why .side p { margin-top:22px; color:var(--ink2); font-size:18px; }
.why .side .ph { margin-top:36px; height:300px; border-radius:24px; overflow:hidden; }
.reasons { list-style:none; margin:0; padding:0; }
.reasons li { display:grid; grid-template-columns:64px 0.85fr 1.25fr; gap:24px; padding:22px 0; border-top:1px solid var(--line); align-items:baseline; }
.reasons li:last-child { border-bottom:1px solid var(--line); }
.reasons .n { font-family:var(--fl); font-size:14px; color:var(--mute); }
.reasons h3 { font-size:30px; line-height:1.05; }
.reasons p { font-size:17px; color:var(--ink2); }
.reasons li.no h3, .reasons li.no p { color:var(--mute); }
/* 80 % */
.exist { position:relative; background:#fff; padding:0; overflow:hidden; }
.exist .left { position:relative; z-index:1; width:680px; padding:80px 72px; display:flex; flex-direction:column; justify-content:space-between; gap:48px; }
.exist .planfull { position:absolute; inset:0; z-index:0; background:#fff; color:#141414; }
.exist .planfull::after { content:""; position:absolute; inset:0; background:linear-gradient(90deg,#fff 0%,rgba(255,255,255,.95) 36%,rgba(255,255,255,.55) 50%,rgba(255,255,255,0) 64%); pointer-events:none; }
.exist .planfull svg.plan { position:absolute; inset:0; width:100% !important; height:100% !important; }
.exist .cta2 .fields { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px; }
.exist .cta2 .f { height:56px; border-radius:14px; background:#fff; box-shadow:inset 0 0 0 1px var(--line); padding:0 18px; display:flex; align-items:center; color:var(--mute); font-size:15px; }
.exist .cta2 .btn { margin-top:12px; width:100%; justify-content:space-between; }
.big80 { font-family:var(--fd); font-weight:700; font-size:240px; line-height:.8; letter-spacing:-0.05em; }
.big80 sup { font-size:110px; vertical-align:top; position:relative; top:22px; }
.exist h2 { margin-top:26px; font-size:44px; line-height:1.04; max-width:560px; }
.exist .body { margin-top:22px; font-size:18px; color:var(--ink2); max-width:560px; }
.phases { margin-top:34px; display:flex; gap:10px; font-size:14px; font-weight:600; }
.phases span { padding:9px 14px; border-radius:999px; background:#fff; }
.drop { padding:10px; border-radius:34px; background:#fff; box-shadow:0 30px 60px -30px rgba(0,0,0,.18); }
.drop .in { border-radius:26px; padding:34px; background:var(--paper); }
.drop .zone { height:220px; border-radius:20px; border:1.5px dashed #b9b9b4; display:grid; place-items:center; text-align:center; color:var(--ink2); }
.drop .zone b { display:block; font-family:var(--fd); font-size:24px; color:var(--ink); }
.drop .zone small { display:block; margin-top:8px; font-family:var(--fl); font-size:12px; letter-spacing:.1em; color:var(--mute); }
.drop .fields { margin-top:16px; display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.drop .f { height:56px; border-radius:14px; background:#fff; box-shadow:inset 0 0 0 1px var(--line); padding:0 18px; display:flex; align-items:center; color:var(--mute); font-size:15px; }
.drop .btn { margin-top:16px; width:100%; justify-content:space-between; }
/* Proof */
.proof { padding:120px 72px 112px; }
.quote { display:grid; grid-template-columns:150px 1fr; gap:48px; }
.quote .mark { font-family:var(--fd); font-weight:700; font-size:200px; line-height:.7; color:var(--line); }
.quote blockquote { margin:0; font-family:var(--fd); font-weight:600; font-size:38px; line-height:1.18; letter-spacing:-0.02em; max-width:1080px; }
.quote cite { display:block; margin-top:26px; font-style:normal; font-size:16px; color:var(--mute); }
.fm .sentence { margin-top:72px; font-family:var(--fd); font-weight:600; font-size:48px; line-height:1.12; letter-spacing:-0.025em; color:#b5b5b0; max-width:1240px; }
.sentence b { color:var(--ink); font-weight:700; }
.stats { margin-top:56px; display:grid; grid-template-columns:repeat(4,1fr); }
.stats div { padding-right:24px; }
.stats b { display:block; font-family:var(--fd); font-weight:700; font-size:68px; line-height:.9; letter-spacing:-0.04em; }
.stats span { display:block; margin-top:14px; font-size:16px; color:var(--ink2); max-width:220px; }
/* Customers band */
.band { margin:0 56px; display:grid; grid-template-columns:1.25fr 1fr; gap:12px; }
.band > div { border-radius:30px; padding:40px 44px; }
.band .a { background:var(--dark); color:#fff; }
.band .b { background:var(--soft); display:flex; flex-direction:column; justify-content:space-between; align-items:flex-start; }
.band h3 { font-size:34px; line-height:1.04; }
.band ul { list-style:none; margin:26px 0 0; padding:0; display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.band li { border-radius:16px; padding:18px; background:rgba(255,255,255,.07); box-shadow:inset 0 0 0 1px rgba(255,255,255,.12); font-weight:600; display:flex; justify-content:space-between; }
.band .mail { margin-top:20px; font-size:15px; color:rgba(255,255,255,.65); }
.band .b p { margin-top:14px; font-size:17px; color:var(--ink2); }
/* Engineers */
.eng { padding:80px 72px 80px; display:grid; grid-template-columns:1.1fr 1fr; gap:90px; align-items:center; }
.eng h2 { margin-top:22px; font-size:56px; line-height:1; }
.eng .body { margin-top:22px; font-size:18px; color:var(--ink2); max-width:520px; }
.eng .btn { margin-top:34px; }
.sheet { padding:10px; border-radius:34px; background:var(--soft); }
.sheet .in { border-radius:26px; background:#fff; padding:34px 36px; box-shadow:0 1px 0 rgba(0,0,0,.04); }
.sheet .top { display:flex; justify-content:space-between; align-items:baseline; padding-bottom:22px; border-bottom:1px solid var(--line); }
.sheet .top b { font-family:var(--fd); font-size:26px; }
.sheet table { width:100%; border-collapse:collapse; margin-top:6px; font-size:15px; }
.sheet td { padding:13px 0; border-bottom:1px solid var(--soft); }
.sheet td:first-child { font-family:var(--fl); font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--mute); width:46%; }
.sheet td .bar { display:inline-block; height:10px; border-radius:5px; background:#e6e6e3; }
.sheet .dl { margin-top:22px; display:flex; gap:10px; }
.sheet .dl span { padding:10px 16px; border-radius:999px; background:var(--soft); font-size:14px; font-weight:600; }
/* Contact */
.cb { padding:72px 72px 0; display:grid; grid-template-columns:1fr 1.1fr; gap:72px; }
.cb h2 { font-size:84px; line-height:.92; }
.cb .lead { margin-top:22px; font-size:19px; color:var(--ink2); max-width:480px; }
.cb .ppl { margin-top:40px; display:grid; grid-template-columns:1fr 1fr; gap:16px; max-width:560px; }
.cb .ppl > div { display:grid; gap:16px; }
.cb .ppl .av { width:100%; height:300px; border-radius:22px; overflow:hidden; background:var(--soft); }
.cb .ppl .av img { width:100%; height:100%; object-fit:cover; object-position:50% 20%; display:block; }
.cb .ppl b { display:block; font-size:17px; } .cb .ppl span span { display:block; margin-top:2px; font-size:14px; color:var(--mute); }
.cb .form { padding:10px; border-radius:36px; background:var(--soft); display:flex; }
.cb .form .in { flex:1; display:flex; flex-direction:column; border-radius:28px; background:#fff; padding:34px; }
.cb .form .lab { font-family:var(--fl); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--mute); }
.cb .chips { margin-top:12px; display:flex; flex-wrap:wrap; gap:8px; }
.cb .chips span { padding:11px 16px; border-radius:999px; font-size:14px; font-weight:600; box-shadow:inset 0 0 0 1.5px var(--line); }
.cb .chips span.on { background:var(--ink); color:#fff; box-shadow:none; }
.cb .form .f2 { margin-top:22px; display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.cb .form .f { height:56px; border-radius:14px; box-shadow:inset 0 0 0 1px var(--line); padding:0 18px; display:flex; align-items:center; color:var(--mute); font-size:15px; }
.cb .form .ta { margin-top:12px; flex:1; min-height:120px; border-radius:14px; box-shadow:inset 0 0 0 1px var(--line); padding:16px 18px; color:var(--mute); font-size:15px; }
.cb .form .btn { margin-top:16px; width:100%; justify-content:space-between; }
.contact { margin:0 56px; border-radius:40px; background:var(--dark); color:#fff; padding:90px 72px; display:grid; grid-template-columns:1.1fr 1fr; gap:80px; }
.contact h2 { font-size:84px; line-height:.92; }
.contact .lead { margin-top:26px; font-size:19px; color:rgba(255,255,255,.75); max-width:480px; }
.contact .ctas { margin-top:40px; display:flex; gap:14px; }
.contact .btn.ghost { color:#fff; }
.people { display:grid; grid-template-columns:1fr 1fr; gap:14px; align-self:end; }
.person .ph { height:300px; border-radius:22px; background:#2a2a2a; overflow:hidden; }
.person .ph img { width:100%; height:100%; object-fit:cover; object-position:50% 20%; display:block; }
.person b { display:block; margin-top:18px; font-size:19px; }
.person span { display:block; font-size:15px; color:rgba(255,255,255,.65); margin-top:2px; }
/* Footer */
.foot { margin-top:72px; background:#0c0c0c; color:#bdbdbd; padding:64px 72px 36px; }
.foot .grid { display:grid; grid-template-columns:1.5fr 1fr 1fr 1fr; gap:40px; padding-bottom:60px; border-bottom:1px solid #2a2a2a; }
.foot .logo { color:#fff; font-size:28px; }
.foot p { margin-top:18px; max-width:300px; font-size:15px; }
.foot h4 { margin:0 0 16px; color:#fff; font-size:14px; font-weight:600; }
.foot ul { list-style:none; margin:0; padding:0; display:grid; gap:9px; font-size:15px; }
.foot .bottom { padding-top:26px; display:flex; justify-content:space-between; font-size:13px; }
.foot .bottom span a { margin-left:24px; }
.wb { padding:84px 72px; }
.wb .head { display:flex; justify-content:space-between; align-items:flex-end; }
