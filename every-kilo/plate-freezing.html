<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plate Freezing Systems | Finmatec</title>
<meta name="description" content="Finmatec Plate Freezing Systems prototype, generated from the Claude Design canvas. Genero, 17.11.2026.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400..800&amp;display=swap">
<style media="(min-width:761px)">
.fm { --ink:#141414; --ink2:#3d3d3d; --mute:#6b6b6b; --line:#dcdcd8; --soft:#efefec; --paper:#f7f7f5; --dark:#111111; --dark2:#1c1c1c;
  --ease: cubic-bezier(.32,.72,0,1);
  width:1440px; background:#fff; color:var(--ink); font-family:var(--fb); font-size:17px; line-height:1.55; -webkit-font-smoothing:antialiased; overflow:hidden; }
.fm * { box-sizing:border-box; }
.fm p { margin:0; }
.fm h1,.fm h2,.fm h3 { margin:0; font-family:var(--fd); font-weight:700; letter-spacing:-0.025em; line-height:1; }
.fm a { color:inherit; text-decoration:none; }
.fm img, .fm video { display:block; width:100%; height:100%; object-fit:cover; }
.wrap { padding:0 72px; }
.mono { font-family:var(--fl); font-size:12px; letter-spacing:.12em; text-transform:uppercase; }
.eyebrow { display:inline-flex; align-items:center; gap:10px; font-family:var(--fl); font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--mute); }
.eyebrow::before { content:""; width:18px; height:1px; background:currentColor; }

/* Buttons: pill with nested arrow */
.btn { display:inline-flex; align-items:center; gap:14px; height:56px; padding:0 8px 0 26px; border-radius:999px; font-weight:600; font-size:16px; transition:transform .5s var(--ease); white-space:nowrap; }
.btn i { width:40px; height:40px; border-radius:50%; display:grid; place-items:center; font-style:normal; font-size:17px; }
.btn.dark { background:var(--ink); color:#fff; } .btn.dark i { background:rgba(255,255,255,.14); }
.btn.light { background:#fff; color:var(--ink); } .btn.light i { background:var(--soft); }
.btn.ghost { box-shadow:inset 0 0 0 1.5px currentColor; padding:0 26px; }
.tlink { display:inline-flex; gap:10px; align-items:center; font-weight:600; border-bottom:1.5px solid currentColor; padding-bottom:3px; }

/* Utility + header */
.util { height:38px; background:var(--dark); color:#cfcfcf; font-size:13px; display:flex; align-items:center; justify-content:space-between; padding:0 72px; }
.util span { margin-right:28px; } .util b { color:#fff; font-weight:600; }
.lang { display:inline-flex; gap:2px; border:1px solid rgba(255,255,255,.25); border-radius:999px; padding:2px; margin-left:20px; }
.lang em { font-style:normal; padding:2px 10px; border-radius:999px; font-size:12px; } .lang em:first-child { background:#fff; color:var(--ink); }

.hero { position:relative; height:860px; background:var(--dark); color:#fff; }
.hero .media { position:absolute; inset:0; }
.hero .media::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(10,10,10,.55) 0%, rgba(10,10,10,.05) 30%, rgba(10,10,10,.35) 58%, rgba(10,10,10,.92) 100%); }
.nav { position:absolute; top:22px; left:56px; right:56px; height:68px; display:flex; align-items:center; gap:40px; padding:0 10px 0 26px; border-radius:999px; background:linear-gradient(180deg,rgba(255,255,255,.78),rgba(255,255,255,.62)); color:var(--ink); box-shadow:inset 0 1px 0 rgba(255,255,255,.95), inset 0 0 0 1px rgba(255,255,255,.55), 0 14px 36px -14px rgba(0,0,0,.45); -webkit-backdrop-filter:blur(22px) saturate(170%); backdrop-filter:blur(22px) saturate(170%); z-index:2; }
.fm img.logoimg { width:auto; height:30px; object-fit:contain; }
.fm img.logoimg.dark { filter:brightness(0) saturate(0); opacity:.92; }
.foot img.logoimg { height:34px; }
.logo { font-family:var(--fd); font-weight:700; font-size:21px; letter-spacing:.04em; }
.nav ul { list-style:none; display:flex; gap:30px; margin:0; padding:0; font-size:15px; font-weight:500; }
.nav ul li span { opacity:.6; font-size:11px; margin-left:5px; }
.nav .btn { margin-left:auto; height:50px; } .nav .btn i { width:34px; height:34px; }
.hero-copy { position:absolute; left:72px; right:72px; bottom:168px; z-index:1; }
.hero h1 { font-size:84px; max-width:1296px; line-height:.96; }
.hero .lead { margin-top:28px; font-size:21px; line-height:1.45; max-width:620px; color:rgba(255,255,255,.82); }
.router { position:absolute; left:56px; right:56px; bottom:40px; display:grid; grid-template-columns:repeat(3,1fr); gap:12px; z-index:1; }
.router a { display:flex; justify-content:space-between; align-items:center; height:88px; padding:0 14px 0 24px; border-radius:22px; background:rgba(255,255,255,.08); box-shadow:inset 0 0 0 1px rgba(255,255,255,.16); backdrop-filter:blur(14px); }
.router b { display:block; font-family:var(--fd); font-size:22px; font-weight:700; letter-spacing:-0.02em; }
.router small { display:block; margin-top:3px; font-size:14px; opacity:.75; }
.router i { width:44px; height:44px; border-radius:50%; display:grid; place-items:center; font-style:normal; background:rgba(255,255,255,.14); }
.vidtag { position:absolute; top:112px; right:72px; z-index:1; display:flex; gap:10px; align-items:center; font-size:12px; color:rgba(255,255,255,.8); }
.vidtag::before { content:""; width:8px; height:8px; border-radius:50%; background:#fff; animation:pulse 2s infinite; }
@keyframes pulse { 50% { opacity:.25; } }

/* 40 kg */
.kg { display:grid; grid-template-columns:1.15fr 1fr; gap:56px; align-items:center; padding:80px 72px 72px; }
.kg-num { font-family:var(--fd); font-weight:700; font-size:330px; line-height:.8; letter-spacing:-0.05em; color:var(--ink); }
.kg-num small { font-size:120px; letter-spacing:-0.02em; }
.kg h2 { font-size:46px; line-height:1.02; }
.kg p { margin-top:22px; font-size:19px; color:var(--ink2); max-width:520px; }
.kg .tlink { margin-top:30px; }

/* Flow */
.flow { padding:84px 0 84px; background:var(--paper); }
.flow-head { display:grid; grid-template-columns:minmax(0,1fr) 360px; gap:48px; padding:0 72px; align-items:center; }
.flow h2 { font-size:56px; line-height:1.02; }
.pill { display:inline-block; width:118px; height:50px; border-radius:999px; overflow:hidden; vertical-align:-6px; margin:0 6px; }
.flow-head p { font-size:18px; color:var(--ink2); }
.railwrap { margin-top:52px; overflow:hidden; }
.track { position:relative; display:flex; gap:24px; width:max-content; padding:0 72px; animation:railpan 26s cubic-bezier(.65,0,.35,1) infinite alternate; }
.track > .st { flex:none; width:430px; }
.track > .st.star { width:520px; }
@keyframes railpan { 0%, 14% { transform:translateX(0); } 86%, 100% { transform:translateX(calc(1440px - 100%)); } }
.track::before { content:""; position:absolute; left:72px; right:72px; top:21px; height:1px; background:var(--line); }
.st { position:relative; }
.st .dot { width:42px; height:42px; border-radius:50%; background:#fff; box-shadow:inset 0 0 0 1px var(--line); display:grid; place-items:center; font-family:var(--fl); font-size:12px; margin-bottom:22px; }
.st .ph { height:260px; border-radius:22px; overflow:hidden; }
.st h3 { margin-top:22px; font-size:26px; }
.st .prod { margin-top:10px; font-weight:600; font-size:15px; display:flex; flex-wrap:wrap; gap:4px 14px; }
.st .prod a { border-bottom:1.5px solid currentColor; }
.st p { margin-top:10px; font-size:15px; color:var(--mute); }
.st.star .dot { background:var(--ink); color:#fff; box-shadow:none; }
.st.star .card { background:var(--dark); color:#fff; border-radius:26px; padding:8px 8px 26px; }
.st.star .ph { height:260px; border-radius:20px; }
.st.star h3, .st.star .prod, .st.star p { padding:0 18px; }
.st.star p { color:rgba(255,255,255,.7); }
.st.star .badge { display:inline-block; margin:18px 18px 0; font-family:var(--fl); font-size:11px; letter-spacing:.12em; text-transform:uppercase; border:1px solid rgba(255,255,255,.3); border-radius:999px; padding:4px 10px; }
.st.star h3 { margin-top:12px; }
.flow-foot { margin:44px 72px 0; padding-top:28px; border-top:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; font-size:18px; }

/* Plate freezing */
.pf { background:var(--dark); color:#fff; padding:88px 72px; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:72px; align-items:stretch; }
.pf .eyebrow { color:rgba(255,255,255,.6); }
.pf h2 { margin-top:20px; font-size:52px; line-height:1; }
.pf .body { margin-top:24px; font-size:18px; color:rgba(255,255,255,.75); max-width:none; }
.seg { margin-top:32px; display:grid; grid-template-columns:repeat(3,1fr); padding:5px; border-radius:999px; background:rgba(255,255,255,.07); box-shadow:inset 0 0 0 1px rgba(255,255,255,.12); }
.seg span { text-align:center; padding:14px 0; border-radius:999px; font-size:15px; font-weight:600; color:rgba(255,255,255,.65); }
.seg span.on { background:#fff; color:var(--ink); }
.level { position:relative; margin-top:34px; display:grid; grid-template-columns:repeat(4,1fr); gap:0; }
.level .belt { position:absolute; left:7px; right:0; top:5px; height:4px; border-radius:2px; background:rgba(255,255,255,.1); overflow:hidden; z-index:0; }
.level .belt::after { content:""; position:absolute; inset:0 -48px 0 0; background:repeating-linear-gradient(90deg, rgba(255,255,255,.9) 0 14px, transparent 14px 24px); animation:belt 1.2s linear infinite; }
@keyframes belt { from { transform:translateX(-24px); } to { transform:translateX(0); } }
.level > div:not(.belt) { position:relative; z-index:1; padding-top:30px; }
.level > div:not(.belt)::before { content:""; position:absolute; left:0; top:0; width:14px; height:14px; border-radius:50%; background:var(--dark); box-shadow:inset 0 0 0 3px #fff; }
.level div b { display:block; font-size:17px; margin-top:4px; } .level div small { font-family:var(--fl); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:rgba(255,255,255,.55); }
.level div.auto small { color:#fff; }
.pf .cap { margin-top:22px; font-size:15px; color:rgba(255,255,255,.6); }
.pf .ctas { margin-top:36px; display:flex; gap:14px; align-items:center; }
.pf .btn.ghost { color:#fff; }
.bezel { padding:10px; border-radius:34px; background:rgba(255,255,255,.06); box-shadow:inset 0 0 0 1px rgba(255,255,255,.12); display:flex; }
.bezel .in { flex:1; min-height:520px; border-radius:26px; overflow:hidden; position:relative; }
.bezel .in video { position:absolute; inset:0; opacity:0; animation:clips 18s infinite; }
.bezel .in video:nth-of-type(2) { animation-delay:6s; } .bezel .in video:nth-of-type(3) { animation-delay:12s; }
@keyframes clips { 0% { opacity:0; } 4% { opacity:1; } 33% { opacity:1; } 38% { opacity:0; } 100% { opacity:0; } }
.bezel .tag { position:absolute; left:20px; bottom:20px; background:rgba(0,0,0,.5); backdrop-filter:blur(8px); color:#fff; border-radius:999px; padding:8px 14px; font-size:13px; }

/* Why */
.why { padding:100px 72px 90px; display:grid; grid-template-columns:420px 1fr; gap:90px; }
.why h2 { font-size:60px; line-height:1; }
.why .side p { margin-top:22px; color:var(--ink2); font-size:18px; }
.why .side .ph { margin-top:36px; height:300px; border-radius:24px; overflow:hidden; }
.reasons { list-style:none; margin:0; padding:0; }
.reasons li { display:grid; grid-template-columns:64px 0.85fr 1.25fr; gap:24px; padding:22px 0; border-top:1px solid var(--line); align-items:baseline; }
.reasons li:last-child { border-bottom:1px solid var(--line); }
.reasons .n { font-family:var(--fl); font-size:14px; color:var(--mute); }
.reasons h3 { font-size:30px; line-height:1.05; }
.reasons p { font-size:17px; color:var(--ink2); }
.reasons li.no h3, .reasons li.no p { color:var(--mute); }

/* 80 % */
.exist { position:relative; background:#fff; padding:0; overflow:hidden; }
.exist .left { position:relative; z-index:1; width:680px; padding:80px 72px; display:flex; flex-direction:column; justify-content:space-between; gap:48px; }
.exist .planfull { position:absolute; inset:0; z-index:0; background:#fff; color:#141414; }
.exist .planfull::after { content:""; position:absolute; inset:0; background:linear-gradient(90deg,#fff 0%,rgba(255,255,255,.95) 36%,rgba(255,255,255,.55) 50%,rgba(255,255,255,0) 64%); pointer-events:none; }
.exist .planfull svg.plan { position:absolute; inset:0; width:100% !important; height:100% !important; }
.exist .cta2 .fields { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px; }
.exist .cta2 .f { height:56px; border-radius:14px; background:#fff; box-shadow:inset 0 0 0 1px var(--line); padding:0 18px; display:flex; align-items:center; color:var(--mute); font-size:15px; }
.exist .cta2 .btn { margin-top:12px; width:100%; justify-content:space-between; }
.big80 { font-family:var(--fd); font-weight:700; font-size:240px; line-height:.8; letter-spacing:-0.05em; }
.big80 sup { font-size:110px; vertical-align:top; position:relative; top:22px; }
.exist h2 { margin-top:26px; font-size:44px; line-height:1.04; max-width:560px; }
.exist .body { margin-top:22px; font-size:18px; color:var(--ink2); max-width:560px; }
.phases { margin-top:34px; display:flex; gap:10px; font-size:14px; font-weight:600; }
.phases span { padding:9px 14px; border-radius:999px; background:#fff; }
.drop { padding:10px; border-radius:34px; background:#fff; box-shadow:0 30px 60px -30px rgba(0,0,0,.18); }
.drop .in { border-radius:26px; padding:34px; background:var(--paper); }
.drop .zone { height:220px; border-radius:20px; border:1.5px dashed #b9b9b4; display:grid; place-items:center; text-align:center; color:var(--ink2); }
.drop .zone b { display:block; font-family:var(--fd); font-size:24px; color:var(--ink); }
.drop .zone small { display:block; margin-top:8px; font-family:var(--fl); font-size:12px; letter-spacing:.1em; color:var(--mute); }
.drop .fields { margin-top:16px; display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.drop .f { height:56px; border-radius:14px; background:#fff; box-shadow:inset 0 0 0 1px var(--line); padding:0 18px; display:flex; align-items:center; color:var(--mute); font-size:15px; }
.drop .btn { margin-top:16px; width:100%; justify-content:space-between; }

/* Proof */
.proof { padding:120px 72px 112px; }
.quote { display:grid; grid-template-columns:150px 1fr; gap:48px; }
.quote .mark { font-family:var(--fd); font-weight:700; font-size:200px; line-height:.7; color:var(--line); }
.quote blockquote { margin:0; font-family:var(--fd); font-weight:600; font-size:38px; line-height:1.18; letter-spacing:-0.02em; max-width:1080px; }
.quote cite { display:block; margin-top:26px; font-style:normal; font-size:16px; color:var(--mute); }
.fm .sentence { margin-top:72px; font-family:var(--fd); font-weight:600; font-size:48px; line-height:1.12; letter-spacing:-0.025em; color:#b5b5b0; max-width:1240px; }
.sentence b { color:var(--ink); font-weight:700; }
.stats { margin-top:56px; display:grid; grid-template-columns:repeat(4,1fr); }
.stats div { padding-right:24px; }
.stats b { display:block; font-family:var(--fd); font-weight:700; font-size:68px; line-height:.9; letter-spacing:-0.04em; }
.stats span { display:block; margin-top:14px; font-size:16px; color:var(--ink2); max-width:220px; }

/* Customers band */
.band { margin:0 56px; display:grid; grid-template-columns:1.25fr 1fr; gap:12px; }
.band > div { border-radius:30px; padding:40px 44px; }
.band .a { background:var(--dark); color:#fff; }
.band .b { background:var(--soft); display:flex; flex-direction:column; justify-content:space-between; align-items:flex-start; }
.band h3 { font-size:34px; line-height:1.04; }
.band ul { list-style:none; margin:26px 0 0; padding:0; display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.band li { border-radius:16px; padding:18px; background:rgba(255,255,255,.07); box-shadow:inset 0 0 0 1px rgba(255,255,255,.12); font-weight:600; display:flex; justify-content:space-between; }
.band .mail { margin-top:20px; font-size:15px; color:rgba(255,255,255,.65); }
.band .b p { margin-top:14px; font-size:17px; color:var(--ink2); }

/* Engineers */
.eng { padding:80px 72px 80px; display:grid; grid-template-columns:1.1fr 1fr; gap:90px; align-items:center; }
.eng h2 { margin-top:22px; font-size:56px; line-height:1; }
.eng .body { margin-top:22px; font-size:18px; color:var(--ink2); max-width:520px; }
.eng .btn { margin-top:34px; }
.sheet { padding:10px; border-radius:34px; background:var(--soft); }
.sheet .in { border-radius:26px; background:#fff; padding:34px 36px; box-shadow:0 1px 0 rgba(0,0,0,.04); }
.sheet .top { display:flex; justify-content:space-between; align-items:baseline; padding-bottom:22px; border-bottom:1px solid var(--line); }
.sheet .top b { font-family:var(--fd); font-size:26px; }
.sheet table { width:100%; border-collapse:collapse; margin-top:6px; font-size:15px; }
.sheet td { padding:13px 0; border-bottom:1px solid var(--soft); }
.sheet td:first-child { font-family:var(--fl); font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--mute); width:46%; }
.sheet td .bar { display:inline-block; height:10px; border-radius:5px; background:#e6e6e3; }
.sheet .dl { margin-top:22px; display:flex; gap:10px; }
.sheet .dl span { padding:10px 16px; border-radius:999px; background:var(--soft); font-size:14px; font-weight:600; }

/* Contact */
.cb { padding:72px 72px 0; display:grid; grid-template-columns:1fr 1.1fr; gap:72px; }
.cb h2 { font-size:84px; line-height:.92; }
.cb .lead { margin-top:22px; font-size:19px; color:var(--ink2); max-width:480px; }
.cb .ppl { margin-top:40px; display:grid; grid-template-columns:1fr 1fr; gap:16px; max-width:560px; }
.cb .ppl > div { display:grid; gap:16px; }
.cb .ppl .av { width:100%; height:300px; border-radius:22px; overflow:hidden; background:var(--soft); }
.cb .ppl .av img { width:100%; height:100%; object-fit:cover; object-position:50% 20%; display:block; }
.cb .ppl b { display:block; font-size:17px; } .cb .ppl span span { display:block; margin-top:2px; font-size:14px; color:var(--mute); }
.cb .form { padding:10px; border-radius:36px; background:var(--soft); display:flex; }
.cb .form .in { flex:1; display:flex; flex-direction:column; border-radius:28px; background:#fff; padding:34px; }
.cb .form .lab { font-family:var(--fl); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--mute); }
.cb .chips { margin-top:12px; display:flex; flex-wrap:wrap; gap:8px; }
.cb .chips span { padding:11px 16px; border-radius:999px; font-size:14px; font-weight:600; box-shadow:inset 0 0 0 1.5px var(--line); }
.cb .chips span.on { background:var(--ink); color:#fff; box-shadow:none; }
.cb .form .f2 { margin-top:22px; display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.cb .form .f { height:56px; border-radius:14px; box-shadow:inset 0 0 0 1px var(--line); padding:0 18px; display:flex; align-items:center; color:var(--mute); font-size:15px; }
.cb .form .ta { margin-top:12px; flex:1; min-height:120px; border-radius:14px; box-shadow:inset 0 0 0 1px var(--line); padding:16px 18px; color:var(--mute); font-size:15px; }
.cb .form .btn { margin-top:16px; width:100%; justify-content:space-between; }
.contact { margin:0 56px; border-radius:40px; background:var(--dark); color:#fff; padding:90px 72px; display:grid; grid-template-columns:1.1fr 1fr; gap:80px; }
.contact h2 { font-size:84px; line-height:.92; }
.contact .lead { margin-top:26px; font-size:19px; color:rgba(255,255,255,.75); max-width:480px; }
.contact .ctas { margin-top:40px; display:flex; gap:14px; }
.contact .btn.ghost { color:#fff; }
.people { display:grid; grid-template-columns:1fr 1fr; gap:14px; align-self:end; }
.person .ph { height:300px; border-radius:22px; background:#2a2a2a; overflow:hidden; }
.person .ph img { width:100%; height:100%; object-fit:cover; object-position:50% 20%; display:block; }
.person b { display:block; margin-top:18px; font-size:19px; }
.person span { display:block; font-size:15px; color:rgba(255,255,255,.65); margin-top:2px; }

/* Footer */
.foot { margin-top:72px; background:#0c0c0c; color:#bdbdbd; padding:64px 72px 36px; }
.foot .grid { display:grid; grid-template-columns:1.5fr 1fr 1fr 1fr; gap:40px; padding-bottom:60px; border-bottom:1px solid #2a2a2a; }
.foot .logo { color:#fff; font-size:28px; }
.foot p { margin-top:18px; max-width:300px; font-size:15px; }
.foot h4 { margin:0 0 16px; color:#fff; font-size:14px; font-weight:600; }
.foot ul { list-style:none; margin:0; padding:0; display:grid; gap:9px; font-size:15px; }
.foot .bottom { padding-top:26px; display:flex; justify-content:space-between; font-size:13px; }
.foot .bottom span a { margin-left:24px; }
.wb { padding:84px 72px; }
.wb .head { display:flex; justify-content:space-between; align-items:flex-end; }
.wb h2 { font-size:58px; }
.wb .head p { font-size:18px; color:var(--ink2); max-width:420px; }

/* ===== Theme layer ===== */
.fm h1,.fm h2,.fm h3,.kg-num,.big80,.stats b,.tile .figure,.quote .mark,.router b,.sheet .top b { font-weight:var(--dw); letter-spacing:var(--dls); font-stretch:var(--dst); }
.mono,.eyebrow,.st .dot,.badge,.lab,.level div small,.sheet td:first-child,.reasons .n,.ptitle small { letter-spacing:var(--lls); }

.fm { --ink:#0D0E2B; --ink2:#3A3C5C; --mute:#5F617E; --line:#D9DBE8; --soft:#ECEEF7; --paper:#F5F6FB; --dark:#2415BA; --dark2:#1B1092; --acc:#03FF6B; --deep:#0D0E2B;
  --fd:'Exo 2',sans-serif; --fb:'Exo 2',sans-serif; --fl:'Exo 2',sans-serif; --dw:700; --dls:-0.005em; --dst:112%; --lls:.1em; }
.fm .mono,.fm .eyebrow,.fm .st .dot,.fm .badge,.fm .lab,.fm .level div small,.fm .sheet td:first-child,.fm .reasons .n,.fm .ptitle small,.fm .intro .g small,.fm .cb .form .lab { font-weight:600; font-stretch:112%; }
.util { background:var(--deep); }
.hero { background:var(--deep); }
.btn.dark { background:var(--dark); } .btn.dark i { background:rgba(255,255,255,.16); }

.kg-num { color:var(--dark); }
.st.star .dot { background:var(--acc); color:var(--deep); }

.seg span.on { background:var(--acc); color:var(--deep); }
.fm .sentence { color:#A7A9C6; } .sentence b { color:var(--dark); }
.tile.dark { background:var(--deep); }
.eyebrow { color:var(--dark); } .pf .eyebrow { color:var(--acc); }
.plan .mblk { fill:var(--dark); } .plan .mroute { stroke:var(--dark); opacity:.6; }
.fb2 { background:var(--soft); }
.fb2 .sym path[fill="#e2e2de"] { fill:#E1E4F2; } .fb2 .sym path[fill="#d3d3ce"] { fill:#CDD2EC; }
/* blue headings and highlights */
.fm h2 { color:var(--dark); }
.hero h1 { font-size:64px; line-height:.98; max-width:1180px; }
.pf h2, .hero h1 { color:#fff; }

.big80, .tile .figure { color:var(--dark); }
.quote .mark { color:#C9C6F1; }
.fm .tlink { color:var(--dark); }
/* machined knob: contact CTA only (approved Steel accent) */
.btn.qk i { width:40px; height:40px; color:#0b0a26; filter:drop-shadow(0 1px 0 rgba(255,255,255,.9)); background:repeating-radial-gradient(circle at 50% 50%,rgba(255,255,255,0) 0 1px,rgba(27,29,43,.05) 1px 2px),conic-gradient(from 25deg,#f6f8fa,#a9b0bc 11%,#eef1f5 24%,#99a1ae 37%,#f3f5f8 50%,#adb4c0 63%,#ebeef2 75%,#a1a9b6 88%,#f6f8fa) !important; box-shadow:inset 0 0 0 1px rgba(255,255,255,.7),0 0 0 1px rgba(11,10,38,.18),0 2px 5px rgba(11,10,38,.3); }

/* intro under hero */
.intro { position:relative; padding:112px 72px 72px; background:#fff; overflow:hidden; }
.intro .stmt { margin:0; font-family:var(--fd); font-weight:700; font-stretch:112%; font-size:56px; line-height:1; letter-spacing:-0.03em; color:var(--ink); max-width:1000px; }

.fb2 .word { height:auto !important; overflow:visible !important; } .fb2 .word svg { display:block; width:100%; height:auto; fill:var(--dark); }
.fb2 .sym path[fill="#e2e2de"] { fill:#2415BA; fill-opacity:.085; } .fb2 .sym path[fill="#d3d3ce"] { fill:#03FF6B; fill-opacity:.15; }

      <div class="crumb"><span>Products</span><i>/</i><span>Plate Freezing Systems</span></div>
      <h1>Plate Freezing Systems</h1>
      <p class="sub">Automated plate freezer loading, unloading and palletising.</p>
      <p class="lead">Freezing raw material into blocks is a cost and energy efficient way to handle large volumes. Emptying a plate freezer by hand is heavy, dangerous and ties up people. We build and integrate the automation around the freezers.</p>
    </div>
    <div class="hctas"><a class="btn light " href="contact.html">Request a budget quote <i><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4"></path></svg></i></a><a class="btn ghost " href="#">See it in action</a></div>
  </div>
  <div class="hstats">
    <div><b>180 t / 24 h</b><small>Capacity up to 180 tonnes a day</small></div>
    <div><b>20-45 kg</b><small>Blocks, and bins up to 200 kg</small></div>
    <div><b>1 person</b><small>Can operate the system</small></div>
    <div><b>2-5 yrs</b><small>Typical payback, often</small></div>
  </div>
</section>
<!-- 2 Miksi automatisoida -->
<section class="sec">
  <div class="why2">
    <div><div class="kgn">40<small>kg</small></div><p class="kgcap">Slippery frozen blocks of up to 40 kg, lifted by hand, freezer after freezer.</p></div>
    <div>
      <span class="eyebrow">Why automate</span>
      <h2>Take the heaviest job off the floor.</h2>
      <div class="vs">
        <div class="hand"><span class="mono2">By hand</span><ul>
          <li><i></i><span>Slippery frozen blocks of up to 40 kg handled by hand</span></li>
          <li><i></i><span>Crush and slip injuries, and wear on backs and shoulders</span></li>
          <li><i></i><span>Extra pairs of boots tied to the heaviest workstations</span></li>
        </ul></div>
        <div class="auto"><span class="mono2" style="color:var(--dark)">Automated</span><ul>
          <li><i></i><span>Filling, unloading and palletising run without heavy lifting</span></li>
          <li><i></i><span>Lower risk of occupational accidents</span></li>
          <li><i></i><span>Lifts and kilos per shift removed, not only person-years</span></li>
        </ul></div>
      </div>
    </div>
  </div>
</section>
<!-- 3 Materiaalivirta (iso idea) -->
<section class="sec paper mflow">
  <div class="shead">
    <div><span class="eyebrow">The material flow</span><h2>From filling to a wrapped pallet. We do everything but the freezer.</h2></div>
    <p>You buy freezing as part of the whole flow. Every step shows who does it, so you see what our quote covers at a glance.</p>
  </div>
  <div class="rail"><span class="beltbar"></span><span class="blk"></span><span class="blk"></span><span class="blk"></span><span class="blk"></span><div class="stp"><span class="nd">01</span><span class="mono2 who">Finmatec</span><h3>Filling</h3><p>By tipping (a bin on rails, gentle handling) or by pumping (a pump on rails with a swivel arm). Pumping is recommended for minced material and small fish.</p></div><div class="stp js"><span class="nd">02</span><span class="mono2 who">Partner · Jackstone</span><h3>Freezing</h3><p>Vertical plate freezers by Jackstone Freezing Systems (UK).</p></div><div class="stp"><span class="nd">03</span><span class="mono2 who">Finmatec</span><h3>Unloading</h3><p>The unloader lifts all blocks out of the freezer at once. The devices are mounted on an overhead crane.</p></div><div class="stp"><span class="nd">04</span><span class="mono2 who">Finmatec</span><h3>Crane</h3><p>Automatic or manual. The automatic crane drives to the stacking table and on to the next freezer.</p></div><div class="stp"><span class="nd">05</span><span class="mono2 who">Finmatec</span><h3>Metal detection</h3><p>Metal detection before the blocks are stacked.</p></div><div class="stp"><span class="nd">06</span><span class="mono2 who">Finmatec</span><h3>Stacking</h3><p>By robot, by automatic manipulator or by hand with a vacuum gripper.</p></div><div class="stp"><span class="nd">07</span><span class="mono2 who">Finmatec</span><h3>Wrap, weigh, label</h3><p>The full pallet is wrapped, weighed and labelled, with a slip sheet between layers.</p></div><div class="stp"><span class="nd">08</span><span class="mono2 who">Storage or crushing</span><h3>Next</h3><p>Storage, or crushing the blocks for further processing.</p><div class="lk"><a href="#">BinStacker &#8594;</a><a href="titan.html">Titan Series &#8594;</a></div><div style="margin-top:10px"><span class="tbc">To be confirmed</span></div></div></div>
  <div class="legend"><span><i></i>Finmatec</span><span><i class="p"></i>Partner</span><a class="tlink" href="how-we-deliver.html">How we deliver a project &#8594;</a></div>
</section>
<!-- 4 Oikea automaatioaste -->
<section class="sec um alvl">
  <div class="shead">
    <div><span class="eyebrow">The right level of automation</span><h2>We automate as far as it makes economic sense.</h2></div>
    <p>We often semi-automate, because a high level of automation does not pay off at small and medium volumes. <span class="tbc">Standard range</span></p>
  </div>
  <div class="seg"><span>Manual stacking</span><span>Semi-automatic</span><span class="on">Fully automatic</span></div>
  <div class="atab"><div class="h r"></div><div class="h">Manual stacking<span class="src">Brochure: vacuum gripper</span></div><div class="h">Semi-automatic (SA)<span class="src">Brochure: process automation</span></div><div class="h fa">Fully automatic (FA)<span class="src">Brochure: process automation</span></div><div class="r">For whom</div><div class="lbl" data-l="Manual stacking">Small and medium volumes</div><div class="lbl" data-l="Semi-automatic (SA)"><span class="phv">[not in source]</span></div><div class="lbl fa" data-l="Fully automatic (FA)">Continuous production</div><div class="r">What is automated</div><div class="lbl" data-l="Manual stacking">Unloading from the freezer. Blocks are moved to the pallet by hand with a vacuum gripper</div><div class="lbl" data-l="Semi-automatic (SA)">Unloading and tilting conveyors. Weighing, wrapping, rejection and pallet feed by hand, with a scissor lift for ergonomics</div><div class="lbl fa" data-l="Fully automatic (FA)">Cross stacking, weighing, wrapping, rejection, pallet feed and slip sheet</div><div class="r">Capacity</div><div class="lbl" data-l="Manual stacking"><span class="phv">[not in source]</span></div><div class="lbl" data-l="Semi-automatic (SA)"><span class="phv">[not in source]</span></div><div class="lbl fa" data-l="Fully automatic (FA)">Up to 15 t/h</div><div class="r">Space</div><div class="lbl" data-l="Manual stacking">Needs only a low ceiling height</div><div class="lbl" data-l="Semi-automatic (SA)"><span class="phv">[not in source]</span></div><div class="lbl fa" data-l="Fully automatic (FA)"><span class="phv">[not in source]</span></div><div class="r">Investment</div><div class="lbl" data-l="Manual stacking">Low investment cost</div><div class="lbl" data-l="Semi-automatic (SA)"><span class="phv">[not in source]</span></div><div class="lbl fa" data-l="Fully automatic (FA)"><span class="phv">[not in source]</span></div></div>
  <p class="robot">Robot stacking is a fourth option in the brochure. Empty cells are not in our sources yet and are not filled with assumptions.</p>
</section>

    <p>You buy freezing as part of the whole flow. Every step shows who does it, so you see what our quote covers at a glance.</p>

  <div class="rail"><span class="beltbar"></span><span class="blk"></span><span class="blk"></span><span class="blk"></span><span class="blk"></span><div class="stp"><span class="nd">01</span><span class="mono2 who">Finmatec</span><h3>Filling</h3><p>By tipping (a bin on rails, gentle handling) or by pumping (a pump on rails with a swivel arm). Pumping is recommended for minced material and small fish.</p></div><div class="stp js"><span class="nd">02</span><span class="mono2 who">Partner · Jackstone</span><h3>Freezing</h3><p>Vertical plate freezers by Jackstone Freezing Systems (UK).</p></div><div class="stp"><span class="nd">03</span><span class="mono2 who">Finmatec</span><h3>Unloading</h3><p>The unloader lifts all blocks out of the freezer at once. The devices are mounted on an overhead crane.</p></div><div class="stp"><span class="nd">04</span><span class="mono2 who">Finmatec</span><h3>Crane</h3><p>Automatic or manual. The automatic crane drives to the stacking table and on to the next freezer.</p></div><div class="stp"><span class="nd">05</span><span class="mono2 who">Finmatec</span><h3>Metal detection</h3><p>Metal detection before the blocks are stacked.</p></div><div class="stp"><span class="nd">06</span><span class="mono2 who">Finmatec</span><h3>Stacking</h3><p>By robot, by automatic manipulator or by hand with a vacuum gripper.</p></div><div class="stp"><span class="nd">07</span><span class="mono2 who">Finmatec</span><h3>Wrap, weigh, label</h3><p>The full pallet is wrapped, weighed and labelled, with a slip sheet between layers.</p></div><div class="stp"><span class="nd">08</span><span class="mono2 who">Storage or crushing</span><h3>Next</h3><p>Storage, or crushing the blocks for further processing.</p><div class="lk"><a href="#">BinStacker &#8594;</a><a href="titan.html">Titan Series &#8594;</a></div><div style="margin-top:10px"><span class="tbc">To be confirmed</span></div></div></div>
  <div class="legend"><span><i></i>Finmatec</span><span><i class="p"></i>Partner</span><a class="tlink" href="how-we-deliver.html">How we deliver a project &#8594;</a></div>
</section>

<section class="sec um alvl">

    <div><span class="eyebrow">The right level of automation</span><h2>We automate as far as it makes economic sense.</h2></div>
    <p>We often semi-automate, because a high level of automation does not pay off at small and medium volumes. <span class="tbc">Standard range</span></p>
  </div>

<script>
/* Proto navigation: dropdowns on desktop, full-screen menu on mobile.
   Menu structure from the canvas artboard Navigaatio.dc.html (main site, EN). Pages not in the proto are shown without a link. */
(function(){
  var MENU=[
    /* [label, items, hub]: the hub (overview page) heads the panel as its own link, set apart from the items (Olli 17.11.) */
    ['Food Processing',[['Meat Processing',''],['Poultry Processing',''],['Pet Food Processing','pet-food.html']],null],
    ['Products',[['Plate Freezing Systems','plate-freezing.html'],['BinStacker',''],['Titan Series','titan.html'],['Finmatec Mixers','mixers.html'],['Handling equipment','handling-equipment.html']],['All products','products.html']],
    ['Service & Spare Parts',[['Spare Parts','spare-parts.html'],['Service & support','service.html'],['Upgrades & retrofits','service.html#upgrades']],null],
    ['References','references.html'],
    ['Resources',[['Engineering Resources',''],['Guides','']],null],
    ['About',[['How We Deliver','how-we-deliver.html'],['Safety & Cleanability','safety.html'],['News','news.html'],['Join our team','join.html']],['About Finmatec','about.html']]
  ];
  if(window.FM_HUBS) MENU.forEach(function(m){ if(window.FM_HUBS[m[0]]) m[2]=window.FM_HUBS[m[0]]; });
  var here=(location.pathname.split('/').pop()||'index.html');
  function esc(s){return s.replace(/&/g,'&amp;');}
  function hub(h){ return h ? '<a class="hub" href="'+h[1]+'"'+(h[1]===here?' aria-current="page"':'')+'>'+esc(h[0])+' <span aria-hidden="true">&rarr;</span></a>' : ''; }
  function item(l){ return l[1] ? '<a href="'+l[1]+'"'+(l[1]===here?' aria-current="page"':'')+'>'+esc(l[0])+'</a>' : '<span class="off">'+esc(l[0])+'</span>'; }
  var css='.pnav-dd{position:absolute;top:calc(100% + 14px);left:-18px;min-width:250px;padding:10px;border-radius:22px;background:#fff;box-shadow:0 0 0 1px rgba(36,21,186,.10),0 24px 48px -18px rgba(13,14,43,.28);display:none;z-index:50}'
   +'.pnav-li{position:relative}.pnav-li.open .pnav-dd{display:flex;flex-direction:column;align-items:stretch;gap:0}.pnav-li>a,.pnav-li>span.pl{cursor:pointer}'
   +'.fm .nav .pnav-dd a,.fm .nav .pnav-dd .off{display:block!important;width:auto!important;height:auto!important;margin:0!important;border:0;background:none;box-shadow:none;text-transform:none;letter-spacing:0;padding:11px 14px;border-radius:14px;font-size:15px;font-weight:500;line-height:1.3;color:#0D0E2B;text-decoration:none;white-space:nowrap}'
   +'.fm .nav .pnav-dd a:hover,.fm .nav .pnav-dd a[aria-current]{background:#ECEEF7;color:#2415BA}.fm .nav .pnav-dd .off{color:#9a9cb3;cursor:default}.fm .nav .pnav-dd a::before{content:none}'
   +'.fm .nav .pnav-dd a.hub{font-weight:700;color:#2415BA;margin-bottom:8px!important;position:relative}.fm .nav .pnav-dd a.hub::after{content:"";position:absolute;left:14px;right:14px;bottom:-5px;height:1px;background:#D9DBE8}'
   +'.pnav-m a.hub{color:#2415BA}.pnav-m .solo{margin-top:18px}'
   +'.pnav-m{position:fixed;inset:0;z-index:1000;background:#fff;overflow:auto;padding:22px 20px 40px;font-family:"Exo 2",sans-serif;display:none}'
   +'.pnav-m.open{display:block}.pnav-m .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}'
   +'.pnav-m .top img{height:28px}.pnav-m .x{width:44px;height:44px;border-radius:50%;border:0;background:#2415BA;color:#fff;font-size:22px;line-height:1}'
   +'.pnav-m h4{margin:22px 0 6px;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#5F617E}'
   +'.pnav-m a,.pnav-m .off{display:block;padding:12px 0;border-bottom:1px solid #ECEEF7;font-size:18px;font-weight:600;color:#0D0E2B;text-decoration:none}'
   +'.pnav-m .top a{border:0;padding:0}.pnav-m a[aria-current]{color:#2415BA}.pnav-m .off{color:#9a9cb3;font-weight:500}'
   +'.pnav-m .q{display:flex;justify-content:center;margin-top:28px;padding:16px;border-radius:999px;background:#2415BA;color:#fff;border:0}';
  var st=document.createElement('style'); st.textContent=css; document.head.appendChild(st);
  function key(t){return t.replace(/[▾\s]+$/,'').replace(/\s+/g,' ').trim().toLowerCase();}
  var byKey={}; MENU.forEach(function(m){byKey[m[0].toLowerCase()]=m;});
  /* full-bleed photo hero fills the window, util bar and nav included, so its CTAs stay above the fold (Olli 17.11.) */
  (function(){
    var fm=document.querySelector('.fm'), hero=fm&&fm.querySelector('section.hero');
    if(!hero) return;
    var base=parseFloat(getComputedStyle(hero).height)||0; if(base<600) return;
    function fold(){
      var z=parseFloat(fm.style.zoom)||1, m=fm.classList.contains('m');
      var h=window.innerHeight/z-(m?16:24), lo=m?560:620, hi=m?900:1100; /* the next section peeks in */
      hero.style.height=Math.round(Math.max(lo,Math.min(hi,h)))+'px';
    }
    fold(); window.addEventListener('resize',function(){requestAnimationFrame(fold);}); window.addEventListener('load',fold);
  })();
  var nav=document.querySelector('.fm .nav'); if(!nav || document.querySelector('.fm.ww')) return; /* WWTP is its own site with its own menu */
  var lis=[].slice.call(nav.querySelectorAll('ul > li'));
  lis.forEach(function(li){
    var m=byKey[key(li.textContent)]; if(!m) return;
    li.classList.add('pnav-li');
    if(typeof m[1]==='string'){ var a=li.querySelector('a'); if(a) a.setAttribute('href',m[1]); else li.innerHTML='<a href="'+m[1]+'">'+li.innerHTML+'</a>'; return; }
    var dd=document.createElement('div'); dd.className='pnav-dd'; dd.innerHTML=hub(m[2])+m[1].map(item).join(''); li.appendChild(dd);
    var trig=li.querySelector('a')||li; if(trig.tagName==='A') trig.setAttribute('href','#');
    trig.setAttribute('aria-haspopup','true'); trig.setAttribute('aria-expanded','false');
    trig.addEventListener('click',function(e){ if(e.target.closest('.pnav-dd')) return; e.preventDefault(); var o=!li.classList.contains('open'); lis.forEach(function(x){x.classList.remove('open');}); li.classList.toggle('open',o); trig.setAttribute('aria-expanded',o?'true':'false'); });
  });
  document.addEventListener('click',function(e){ if(!e.target.closest('.pnav-li')) lis.forEach(function(x){x.classList.remove('open');}); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape'){ lis.forEach(function(x){x.classList.remove('open');}); mm.classList.remove('open'); }});
  /* mobile menu */
  var logo=nav.querySelector('img.logoimg'), mm=document.createElement('div'); mm.className='pnav-m'; mm.setAttribute('role','dialog'); mm.setAttribute('aria-label','Menu');
  mm.innerHTML='<div class="top"><a href="index.html"><img src="'+(logo?logo.getAttribute('src'):'')+'" alt="Finmatec"></a><button class="x" aria-label="Close menu">&times;</button></div>'
    +MENU.map(function(m){ return typeof m[1]==='string' ? '<div class="solo">'+item(m)+'</div>' : '<h4>'+esc(m[0])+'</h4>'+hub(m[2])+m[1].map(item).join(''); }).join('')
    +'<a class="q" href="contact.html">Request a quote</a>';
  document.body.appendChild(mm);
  mm.querySelector('.x').addEventListener('click',function(){mm.classList.remove('open');});
  [].slice.call(document.querySelectorAll('.fm .burger')).forEach(function(b){ b.addEventListener('click',function(e){e.preventDefault(); mm.classList.add('open');}); });
})();
/* Proto forms and links (Olli 17.11.): option chips select, a topic/product in the link preselects the form,
   send buttons check the email and confirm, drop zones open a file picker, and links without a target do nothing. */
(function(){
  var fm=document.querySelector('.fm'); if(!fm) return;
  var st=document.createElement('style');
  st.textContent='.fm a[href="#"]:not([aria-haspopup]){cursor:default}'
    +'.fm .pf-err{border-bottom-color:#d93a3a!important}.fm .pf-sent{margin-top:14px;font-size:15px;font-weight:600;color:#2415BA}'
    +'.fm .fpz-drop{cursor:pointer}.fm .fpz-drop.has b{color:#2415BA}';
  document.head.appendChild(st);
  /* option chips: one choice per group */
  fm.addEventListener('click',function(e){
    var c=e.target.closest('button.chip.opt'); if(!c) return;
    var g=c.closest('.chips')||c.parentNode;
    [].forEach.call(g.querySelectorAll('button.chip.opt'),function(b){ var on=b===c; b.classList.toggle('on',on); b.setAttribute('aria-pressed',on?'true':'false'); });
  });
  /* topic and product from the link: #contact?topic=technical&product=CMX%203000 or contact.html?topic=... */
  function params(){
    var q=location.search.slice(1); var h=location.hash; if(h.indexOf('?')>-1) q=(q?q+'&':'')+h.split('?')[1];
    var o={}; q.split('&').forEach(function(kv){ if(!kv) return; var p=kv.split('='); o[decodeURIComponent(p[0])]=decodeURIComponent((p[1]||'').replace(/\+/g,' ')); }); return o;
  }
  var TOPIC={technical:/technical/i, budget:/budget/i, service:/service|something/i, business:/business/i, project:/new project/i};
  function preselect(){
    var p=params(), form=(document.getElementById('contact')||fm).querySelector('.form, form');
    if(!form) return;
    if(p.topic && TOPIC[p.topic]){
      var cs=[].slice.call(form.querySelectorAll('button.chip.opt')), hit=cs.filter(function(b){return TOPIC[p.topic].test(b.textContent);})[0];
      if(hit) hit.click();
    }
    if(p.product){
      var inp=[].slice.call(form.querySelectorAll('input')).filter(function(i){return /product|machine|mixer/i.test((i.name||'')+' '+(i.placeholder||'')+' '+(i.value||''));})[0];
      if(inp) inp.value=(/mixers?/i.test(inp.value)&&!/mixer/i.test(p.product)?inp.value+', ':'')+p.product;
    }
    var anchor=location.hash.split('?')[0];
    if(anchor.length>1){ var t=document.getElementById(anchor.slice(1)); if(t) setTimeout(function(){ t.scrollIntoView(); },60); }
  }
  preselect(); window.addEventListener('hashchange',preselect);
  /* send buttons inside a form */
  fm.addEventListener('click',function(e){
    var b=e.target.closest('a.btn, button.btn'); if(!b) return;
    var f=b.closest('.form, form, .rform, .fpz-pan, .cb'); if(!f || b.closest('.chips')) return;
    if(b.getAttribute('href') && b.getAttribute('href')!=='#' && !b.closest('.form, form, .rform, .fpz-pan')) return;
    e.preventDefault();
    var mail=[].slice.call(f.querySelectorAll('input[type=email], input[name*=mail], input[placeholder*=mail i]'))[0];
    if(mail && !/.+@.+\..+/.test(mail.value)){ var l=mail.closest('label')||mail; l.classList.add('pf-err'); mail.focus(); mail.addEventListener('input',function(){ l.classList.remove('pf-err'); },{once:true}); return; }
    if(b.dataset.sent) return; b.dataset.sent='1';
    var lab=b.firstChild&&b.firstChild.nodeType===3?b.firstChild:null; if(lab) lab.nodeValue='Sent ';
    var msg=document.createElement('p'); msg.className='pf-sent'; msg.textContent='Thank you. We have received your message and will get back to you.';
    b.parentNode.insertBefore(msg,b.nextSibling);
  },true);
  /* drop zones open a file picker and show the chosen file */
  [].forEach.call(fm.querySelectorAll('.fpz-drop'),function(d){
    var i=document.createElement('input'); i.type='file'; i.multiple=true; i.style.display='none'; d.appendChild(i);
    d.addEventListener('click',function(e){ if(e.target!==i) i.click(); });
    i.addEventListener('change',function(){ if(!i.files.length) return; var b=d.querySelector('b'); if(b) b.textContent=i.files.length===1?i.files[0].name:i.files.length+' files added'; d.classList.add('has'); });
  });
  /* links without a target in the proto stay put instead of jumping to the top */
  document.addEventListener('click',function(e){ var a=e.target.closest('a[href="#"]'); if(a && !a.hasAttribute('aria-haspopup')) e.preventDefault(); });
})();
</script>

  poll: 20000
};
/* Finmatec proto: kommenttikerros (Figma-tyylinen pinnikommentointi ilman kirjautumista).
   Sailo tulee tiedostosta comments_config.js. Kerros ei muuta sivun omaa asettelua:
   pinnit piirretaan body-tason overlayhin dokumenttikoordinaatteihin. */
(function () {
  var CFG = window.FMC_CONFIG || {};
  var T = {
    on: 'Kommentoi', off: 'Kommentointi', hint: 'Klikkaa kohtaa, jota haluat kommentoida',
    name: 'Nimesi', text: 'Kommentti', send: 'Lähetä', cancel: 'Peruuta', reply: 'Vastaa',
    resolve: 'Merkitse ratkaistuksi', unresolve: 'Avaa uudelleen', resolved: 'Ratkaistu',
    show: 'Näytä ratkaistut', hide: 'Piilota ratkaistut', thread: 'Kommentti',
    none: 'Ei vielä kommentteja', err: 'Tallennus ei onnistunut, kommentti jäi selaimeen',
    approx: 'Kohta on likimääräinen: kommentoitua kohtaa ei ole tässä näkymässä'
  };
  var PAGE = (location.pathname.split('/').pop() || 'index.html').replace(/\.html$/, '') || 'index';
  var KEY = 'fmc:' + (CFG.project || 'proto') + ':' + PAGE;
  var NAMEKEY = 'fmc:name';
  var fm = null, layer = null, pop = null, draft = null, mode = false, showRes = false;
  var items = [], selected = null, timer = null;

  /* ---------- sailo ---------- */
  function lsRead() { try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { return []; } }
  function lsWrite(v) { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch (e) {} }
  function post(body) {
    return fetch(CFG.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ project: CFG.project, page: PAGE }, body)) })
      .then(function (r) { return r.json(); });
  }
  var store = {
    list: function () {
      if (CFG.store !== 'rest' || !CFG.url) return Promise.resolve(lsRead());
      return fetch(CFG.url + (CFG.url.indexOf('?') < 0 ? '?' : '&') + 'project=' + encodeURIComponent(CFG.project) +
        '&page=' + encodeURIComponent(PAGE)).then(function (r) { return r.json(); })
        .then(function (d) { return (d && d.comments) || []; });
    },
    add: function (c) {
      if (CFG.store !== 'rest' || !CFG.url) { var v = lsRead(); v.push(c); lsWrite(v); return Promise.resolve(c); }
      return post({ action: 'add', comment: c }).then(function (d) { return (d && d.comment) || c; });
    },
    reply: function (id, r) {
      if (CFG.store !== 'rest' || !CFG.url) {
        var v = lsRead(); v.forEach(function (c) { if (c.id === id) (c.replies = c.replies || []).push(r); }); lsWrite(v);
        return Promise.resolve(r);
      }
      return post({ action: 'reply', id: id, reply: r });
    },
    resolve: function (id, val) {
      if (CFG.store !== 'rest' || !CFG.url) {
        var v = lsRead(); v.forEach(function (c) { if (c.id === id) c.resolved = val; }); lsWrite(v);
        return Promise.resolve(true);
      }
      return post({ action: 'resolve', id: id, resolved: val });
    }
  };

  /* ---------- ankkurit ---------- */
  function anchors() { return [fm].concat([].slice.call(fm.querySelectorAll('section, header, footer, .pinwrap'))); }
  function anchorOf(el) {
    var list = anchors();
    while (el && el !== document.body) { var i = list.indexOf(el); if (i >= 0) return { el: el, key: keyOf(el, i) }; el = el.parentElement; }
    return { el: fm, key: keyOf(fm, 0) };
  }
  function keyOf(el, i) { return i + '|' + (el.className || '').toString().split(' ').slice(0, 3).join('.'); }
  function elFor(key) {
    var list = anchors(), i = parseInt(key, 10), cls = key.split('|')[1] || '';
    var same = list.filter(function (e, n) { return keyOf(e, n).split('|')[1] === cls; });
    if (list[i] && keyOf(list[i], i).split('|')[1] === cls) return list[i];
    return same[0] || list[i] || fm;
  }

  /* Pinni kiinnittyy sisaltoelementtiin (otsikko, kappale, kortti, kuva), ei osion
     suhteelliseen kohtaan: osio rivittyy eri tavoin eri leveyksilla ja mobiilissa on oma DOM.
     Elementti tunnistetaan osiosta, tagista ja tekstin alusta, kuvat laakista. */
  var CONTENT = 'h1,h2,h3,h4,h5,h6,p,li,a,button,img,video,figure,blockquote,td,th,label,b,strong,em,small,span,div';
  function textKey(el) {
    if (!el) return '';
    var t = el.tagName.toLowerCase();
    if (t === 'img' || t === 'video' || t === 'source') {
      var src = el.getAttribute('src') || el.getAttribute('data-src') || el.getAttribute('poster') || '';
      return 'src:' + src.split('/').pop();
    }
    return (el.textContent || '').replace(/\s+/g, ' ').trim().toLowerCase().slice(0, 60);
  }
  function contentEl(el, stop) {
    while (el && el !== stop && el !== document.body) {
      if (el.matches && el.matches(CONTENT)) {
        var k = textKey(el), r = el.getBoundingClientRect();
        /* kelpaa vain jos silla on oma tunniste ja jarkeva koko */
        if (k && r.width > 4 && r.height > 4 && r.height < window.innerHeight * 2) return el;
      }
      el = el.parentElement;
    }
    return null;
  }
  function describe(el, sec) {
    var k = textKey(el), t = el.tagName.toLowerCase();
    var scope = sec || fm;
    var list = [].slice.call(scope.querySelectorAll(t)).filter(function (e) {
      if (textKey(e) !== k) return false;
      var r = e.getBoundingClientRect(); return r.width > 0 || r.height > 0;
    });
    return { t: t, k: k, i: Math.max(0, list.indexOf(el)) };
  }
  function findDescribed(c) {
    var d = c.el; if (!d || !d.t || !d.k) return null;
    function hits(scope) {
      return [].slice.call(scope.querySelectorAll(d.t)).filter(function (e) {
        if (textKey(e) !== d.k) return false;
        var r = e.getBoundingClientRect(); return r.width > 0 || r.height > 0;
      });
    }
    var sec = elFor(c.anchor), list = sec ? hits(sec) : [];
    if (!list.length) list = hits(fm);
    return list[d.i] || list[0] || null;
  }
  function docPos(c) {
    var el = findDescribed(c);
    if (el) {
      var r = el.getBoundingClientRect();
      if (r.width || r.height) {
        return { x: r.left + window.pageXOffset + (c.ex == null ? 0.5 : c.ex) * r.width,
          y: r.top + window.pageYOffset + (c.ey == null ? 0.5 : c.ey) * r.height, exact: true };
      }
    }
    /* vanhat kommentit ja elementit joita tassa nakymassa ei ole: osion suhteellinen kohta */
    var sc = elFor(c.anchor); if (!sc) return null;
    var sr = sc.getBoundingClientRect();
    if (!sr.width && !sr.height) return null;
    return { x: sr.left + window.pageXOffset + (c.sx || 0) * sr.width,
      y: sr.top + window.pageYOffset + (c.sy || 0) * sr.height, exact: false };
  }

  /* ---------- piirto ---------- */
  function visible() { return items.filter(function (c) { return showRes || !c.resolved; }); }
  function paint() {
    layer.innerHTML = '';
    visible().forEach(function (c) {
      var p = docPos(c); if (!p) return;
      var b = document.createElement('button');
      b.className = 'fmc-pin' + (c.resolved ? ' fmc-res' : '') + (selected === c.id ? ' fmc-sel' : '')
        + (p.exact ? '' : ' fmc-approx');
      b.style.left = p.x + 'px'; b.style.top = p.y + 'px';
      b.textContent = String(items.indexOf(c) + 1);
      b.title = (c.author || '') + ': ' + (c.text || '').slice(0, 80)
        + (p.exact ? '' : '\n(' + T.approx + ')');
      b.addEventListener('click', function (e) { e.stopPropagation(); openThread(c); });
      layer.appendChild(b);
    });
    if (draft) {
      var d = document.createElement('button');
      d.className = 'fmc-pin fmc-draft'; d.textContent = '+';
      d.style.left = draft.x + 'px'; d.style.top = draft.y + 'px';
      layer.appendChild(d);
    }
    var n = items.filter(function (c) { return !c.resolved; }).length;
    countEl.textContent = n ? n + ' auki' : '';
    if (pop && pop.reposition) pop.reposition();
  }

  /* ---------- popover ---------- */
  function closePop() { if (pop) { pop.remove(); pop = null; } selected = null; }
  function makePop(x, y) {
    closePop();
    var el = document.createElement('div'); el.className = 'fmc fmc-pop';
    document.body.appendChild(el);
    el.reposition = function () {
      var w = el.offsetWidth, vw = document.documentElement.clientWidth;
      var left = Math.min(Math.max(10, x + 20), window.pageXOffset + vw - w - 10);
      el.style.left = left + 'px'; el.style.top = (y + 10) + 'px';
    };
    el.addEventListener('click', function (e) { e.stopPropagation(); });
    pop = el; return el;
  }
  function who() { try { return localStorage.getItem(NAMEKEY) || ''; } catch (e) { return ''; } }
  function setWho(v) { try { localStorage.setItem(NAMEKEY, v); } catch (e) {} }
  function stamp(t) { var d = new Date(t); return ('0' + d.getDate()).slice(-2) + '.' + ('0' + (d.getMonth() + 1)).slice(-2) + '. ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
  function msg(m) {
    var w = document.createElement('div'); w.className = 'fmc-msg';
    var h = document.createElement('div'); h.className = 'fmc-who';
    var b = document.createElement('b'); b.textContent = m.author || '?';
    var s = document.createElement('span'); s.textContent = stamp(m.created);
    var p = document.createElement('p'); p.textContent = m.text;
    h.appendChild(b); h.appendChild(s); w.appendChild(h); w.appendChild(p); return w;
  }
  function form(label, onSend, onCancel) {
    var f = document.createElement('div'); f.className = 'fmc-form';
    var name = document.createElement('input'); name.placeholder = T.name; name.value = who();
    var ta = document.createElement('textarea'); ta.placeholder = label;
    var act = document.createElement('div'); act.className = 'fmc-act';
    var send = document.createElement('button'); send.className = 'fmc-send'; send.textContent = T.send; send.disabled = true;
    var cancel = document.createElement('button'); cancel.className = 'fmc-ghost'; cancel.textContent = T.cancel;
    function check() { send.disabled = !(ta.value.trim() && name.value.trim()); }
    ta.addEventListener('input', check); name.addEventListener('input', check);
    ta.addEventListener('keydown', function (e) { if ((e.metaKey || e.ctrlKey) && e.key === 'Enter' && !send.disabled) send.click(); });
    send.addEventListener('click', function () { setWho(name.value.trim()); onSend(name.value.trim(), ta.value.trim()); });
    cancel.addEventListener('click', onCancel);
    if (!who()) f.appendChild(name);
    f.appendChild(ta); act.appendChild(send); act.appendChild(cancel); f.appendChild(act);
    setTimeout(function () { try { ta.focus({ preventScroll: true }); } catch (e) { ta.focus(); } }, 0);
    return f;
  }
  function head(title, extra) {
    var h = document.createElement('header');
    var b = document.createElement('b'); b.textContent = title; h.appendChild(b);
    if (extra) h.appendChild(extra);
    var x = document.createElement('button'); x.textContent = 'Sulje'; x.addEventListener('click', closePop); h.appendChild(x);
    return h;
  }
  function openDraft(p) {
    draft = p; paint();
    var el = makePop(p.x, p.y);
    el.appendChild(head(T.thread));
    el.appendChild(form(T.text, function (author, text) {
      var c = { id: 'c' + Date.now() + Math.random().toString(36).slice(2, 6), page: PAGE, anchor: p.anchor,
        sx: p.sx, sy: p.sy, el: p.el, ex: p.ex, ey: p.ey, mode: fm.classList.contains('m') ? 'mobile' : 'desktop',
        author: author, text: text, created: Date.now(), resolved: false, replies: [] };
      items.push(c); draft = null; closePop(); paint();
      store.add(c).catch(function () { flash(T.err, true); });
      setMode(false);
    }, function () { draft = null; closePop(); paint(); }));
    el.reposition();
  }
  function openThread(c) {
    selected = c.id; draft = null;
    var p = docPos(c); if (!p) return;
    var el = makePop(p.x, p.y);
    var res = document.createElement('button');
    res.textContent = c.resolved ? T.unresolve : T.resolve;
    res.addEventListener('click', function () {
      c.resolved = !c.resolved; store.resolve(c.id, c.resolved).catch(function () { flash(T.err, true); });
      closePop(); paint();
    });
    el.appendChild(head(c.resolved ? T.resolved : T.thread, res));
    var th = document.createElement('div'); th.className = 'fmc-thread';
    th.appendChild(msg(c)); (c.replies || []).forEach(function (r) { th.appendChild(msg(r)); });
    el.appendChild(th);
    el.appendChild(form(T.reply, function (author, text) {
      var r = { id: 'r' + Date.now(), author: author, text: text, created: Date.now() };
      (c.replies = c.replies || []).push(r); store.reply(c.id, r).catch(function () { flash(T.err, true); });
      openThread(c);
    }, closePop));
    el.reposition();
    th.scrollTop = th.scrollHeight;
    paint();
  }

  /* ---------- tila ---------- */
  var hint = null;
  function flash(text, bad) {
    if (hint) hint.remove();
    hint = document.createElement('div'); hint.className = 'fmc fmc-hint' + (bad ? ' fmc-err' : '');
    hint.textContent = text; document.body.appendChild(hint);
    if (bad) setTimeout(function () { if (hint) { hint.remove(); hint = null; } }, 4000);
  }
  function setMode(on) {
    mode = on; document.body.classList.toggle('fmc-on', on);
    modeBtn.classList.toggle('on', on);
    if (on) flash(T.hint); else if (hint) { hint.remove(); hint = null; }
  }

  /* ---------- palkki ---------- */
  var bar = document.createElement('div'); bar.className = 'fmc fmc-bar';
  var countEl = document.createElement('span'); countEl.className = 'fmc-count';
  var modeBtn = document.createElement('button'); modeBtn.className = 'fmc-mode';
  modeBtn.innerHTML = '<i class="fmc-dot"></i>'; modeBtn.appendChild(document.createTextNode(T.on));
  var resBtn = document.createElement('button'); resBtn.textContent = T.show;
  modeBtn.addEventListener('click', function (e) { e.stopPropagation(); closePop(); draft = null; paint(); setMode(!mode); });
  resBtn.addEventListener('click', function (e) { e.stopPropagation(); showRes = !showRes; resBtn.textContent = showRes ? T.hide : T.show; paint(); });

  /* ---------- kaynnistys ---------- */
  function start() {
    fm = document.querySelector('.fm'); if (!fm) return;
    layer = document.createElement('div'); layer.className = 'fmc fmc-layer';
    document.body.appendChild(layer);
    bar.appendChild(countEl); bar.appendChild(resBtn); bar.appendChild(modeBtn);
    document.body.appendChild(bar);

    document.addEventListener('click', function (e) {
      if (bar.contains(e.target) || (pop && pop.contains(e.target)) || layer.contains(e.target)) return;
      if (!mode) { if (pop) closePop(); paint(); return; }
      e.preventDefault(); e.stopPropagation();
      var hit = document.elementFromPoint(e.clientX, e.clientY);
      var a = anchorOf(hit);
      var r = a.el.getBoundingClientRect(); if (!r.width || !r.height) return;
      var ce = contentEl(hit, a.el), d = null, ex = null, ey = null;
      if (ce) {
        var cr = ce.getBoundingClientRect();
        d = describe(ce, a.el); ex = (e.clientX - cr.left) / cr.width; ey = (e.clientY - cr.top) / cr.height;
      }
      openDraft({ anchor: a.key, sx: (e.clientX - r.left) / r.width, sy: (e.clientY - r.top) / r.height,
        el: d, ex: ex, ey: ey, x: e.pageX, y: e.pageY });
    }, true);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { if (pop) { closePop(); draft = null; paint(); } else if (mode) setMode(false); }
      if (e.key === 'c' && !mode && !/^(INPUT|TEXTAREA)$/.test((e.target.tagName || ''))) setMode(true);
    });
    window.addEventListener('resize', paint);
    window.addEventListener('load', paint);
    if (window.ResizeObserver) new ResizeObserver(paint).observe(fm);

    store.list().then(function (v) { items = v || []; paint(); }).catch(function () { paint(); });
    if (CFG.store === 'rest' && CFG.url && CFG.poll) {
      timer = setInterval(function () {
        if (pop) return;
        store.list().then(function (v) { items = v || []; paint(); }).catch(function () {});
      }, CFG.poll);
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
</script>
<!--fmc:end-->
